name: SafeNotify Weekly Digest

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      include_directors:
        description: Include directors in email
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd automation && npm install firebase-admin resend

      - name: Run SafeNotify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INCLUDE_DIRECTORS: ${{ github.event.inputs.include_directors || 'false' }}
        run: cd automation && node safenotify.js
