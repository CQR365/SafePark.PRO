<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SafeWater.PRO Hot Tub Management - Complete Professional System</title>
    
    <!-- Favicon Fix -->
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
    
    <!-- Firebase Scripts - Load in correct order with ALL required modules -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <!-- Shared Styles from Main App (add to match consistency; adjust as needed) -->
    <style>
        :root {
            --primary-orange: #CC5500;
            --dark-orange: #B8460C;
            --light-orange: #E6672E;
            --success: #28A745;
            --warning: #FFC107;
            --danger: #DC3545;
            --medium-gray: #6C757D;
            --content-background: #2F2F2F;
            --darker-bg: #1a1a1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2A2A2A 0%, #1a1a1a 100%);
            color: #E8E8E8;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .section {
            background: var(--content-background);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        h2 {
            color: var(--primary-orange);
            margin-top: 0;
        }

        h3 {
            color: var(--light-orange);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #B8B8B8;
            font-weight: 500;
        }

        button {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-top: 5px;
        }

        button:hover {
            background: var(--light-orange);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(204, 85, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.danger {
            background: var(--danger);
        }

        button.danger:hover {
            background: #C82333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        select {
            cursor: pointer;
        }

        /* Message Styles */
        #message-container {
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.2);
            border-left: 4px solid var(--success);
            color: #A8E6A8;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.2);
            border-left: 4px solid var(--danger);
            color: #F8A8A8;
        }

        .message.warning {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid var(--warning);
            color: #FFE082;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Park Display Styles */
        .park-card {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-orange);
        }

        .park-card h4 {
            margin: 0 0 10px 0;
            color: var(--light-orange);
        }

        .park-info {
            margin: 5px 0;
            color: #B8B8B8;
        }

        .hot-tub-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .hot-tub-tag {
            background: var(--primary-orange);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .staff-card {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .staff-info {
            flex: 1;
        }

        .staff-name {
            font-weight: 600;
            color: white;
        }

        .staff-details {
            font-size: 12px;
            color: #B8B8B8;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .section {
                padding: 15px;
            }
            button {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="section" id="onboarding">
        <h2>Hot Tub Management Onboarding</h2>
        <p>Add parks, access codes, and hot tubs below.</p>
        
        <div id="message-container"></div>
        
        <div class="form-group">
            <label for="new-park-name">Park Name</label>
            <input id="new-park-name" placeholder="e.g., Overburns Farm">
            
            <label for="new-park-code">Park Access Code</label>
            <input id="new-park-code" placeholder="e.g., 365">
            
            <label for="new-park-units">Hot Tub Units (comma-separated)</label>
            <input id="new-park-units" placeholder="e.g., HT001, HT002">
            
            <button onclick="addParkConfiguration()">Add Park</button>
        </div>
        
        <div class="form-group">
            <label for="new-staff-name">Staff Name</label>
            <input id="new-staff-name" placeholder="e.g., John Smith">
            
            <label for="new-staff-code">Staff Access Code</label>
            <input id="new-staff-code" placeholder="e.g., 365001">
            
            <label for="new-staff-role">Role</label>
            <select id="new-staff-role">
                <option>Manager</option>
                <option>Maintenance</option>
                <option>Cleaner</option>
            </select>
            
            <label for="new-staff-park">Park</label>
            <select id="new-staff-park"></select>
            
            <button onclick="addStaffAccessCode()">Add Staff Code</button>
        </div>
        
        <h3>Configured Parks</h3>
        <div id="configured-parks-container"></div>
    </div>

    <div class="section" id="ht-inspection" style="display: none;">
        <h2>Hot Tub Inspection</h2>
        <p>Select hot tubs and action.</p>
        <!-- Inspection form content here (from original, updated with fixes) -->
    </div>

    <!-- Add more sections for reports, risk assessments, etc. -->

    <script>
        // Firebase Initialization (use main app's config or secure load)
        let db, auth;
        const MODULE_NAME = 'Hot Tub Management';

        // Wait for main Firebase
        function waitForFirebase() {
            if (window.firebase && window.firebase.firestore && window.firebase.auth) {
                db = window.firebase.firestore();
                auth = window.firebase.auth();
                console.log(`${MODULE_NAME} connected to Firebase`);
                return true;
            }
            return false;
        }

        if (!waitForFirebase()) {
            const interval = setInterval(() => {
                if (waitForFirebase()) {
                    clearInterval(interval);
                    initializeModule();
                }
            }, 500);
            setTimeout(() => clearInterval(interval), 10000); // Timeout after 10s
        } else {
            initializeModule();
        }

        function initializeModule() {
            auth.onAuthStateChanged(user => {
                if (!user) {
                    window.parent.postMessage({type: 'AUTH_REQUIRED'}, '*');
                    return;
                }
                loadConfiguration();
            });
        }

        // Updated functions without hardcodes
        let PARK_ACCESS_CODES = {};
        let ACCESS_CODES = {}; // Empty, populated from Firestore
        let HOT_TUB_DATA = {};

        async function loadConfiguration() {
            try {
                const configDoc = await db.collection('safewater-config').doc('system').get();
                if (configDoc.exists) {
                    const data = configDoc.data();
                    PARK_ACCESS_CODES = data.parkCodes || {};
                    ACCESS_CODES = data.accessCodes || {};
                    HOT_TUB_DATA = data.hotTubData || {};
                    console.log('Configuration loaded:', {
                        parks: Object.keys(PARK_ACCESS_CODES).length,
                        codes: Object.keys(ACCESS_CODES).length,
                        hotTubs: Object.keys(HOT_TUB_DATA).length
                    });
                } else {
                    console.log('No existing configuration - starting fresh');
                    PARK_ACCESS_CODES = {};
                    ACCESS_CODES = {};
                    HOT_TUB_DATA = {};
                }
                updateConfigurationDisplay();
                updateParkDropdown();
            } catch (error) {
                console.error('Config load failed:', error);
                showMessage('Failed to load configuration: ' + error.message, 'error');
            }
        }

        async function saveConfiguration() {
            try {
                await db.collection('safewater-config').doc('system').set({
                    parkCodes: PARK_ACCESS_CODES,
                    accessCodes: ACCESS_CODES,
                    hotTubData: HOT_TUB_DATA,
                    lastUpdated: new Date().toISOString(),
                    updatedBy: auth.currentUser ? auth.currentUser.email : 'unknown'
                }, { merge: true });
                
                window.parent.postMessage({type: 'CONFIG_UPDATED'}, '*'); // Notify main app
                console.log('Configuration saved successfully');
                return true;
            } catch (error) {
                console.error('Save failed:', error);
                showMessage('Failed to save: ' + error.message, 'error');
                return false;
            }
        }

        // addParkConfiguration - COMPLETE IMPLEMENTATION
        async function addParkConfiguration() {
            const parkName = document.getElementById('new-park-name').value.trim();
            const parkCode = document.getElementById('new-park-code').value.trim();
            const parkUnitsInput = document.getElementById('new-park-units').value.trim();
            
            // Validation
            if (!parkName) {
                showMessage('Please enter a park name', 'error');
                return;
            }
            
            if (!parkCode) {
                showMessage('Please enter a park access code', 'error');
                return;
            }

            if (PARK_ACCESS_CODES[parkCode]) {
                showMessage('This park code already exists', 'error');
                return;
            }
            
            // Parse hot tub units
            const parkUnits = parkUnitsInput 
                ? parkUnitsInput.split(',').map(u => u.trim()).filter(u => u)
                : [];

            // Add to configuration
            PARK_ACCESS_CODES[parkCode] = parkName;
            HOT_TUB_DATA[parkName] = parkUnits;
            ACCESS_CODES[parkCode] = { 
                type: 'park', 
                name: `${parkName} Manager`, 
                park: parkName, 
                role: 'Manager', 
                message: `Welcome ${parkName}` 
            };

            // Save to Firebase
            const saved = await saveConfiguration();
            
            if (saved) {
                showMessage(`✓ Park "${parkName}" added successfully`, 'success');
                
                // Clear form
                document.getElementById('new-park-name').value = '';
                document.getElementById('new-park-code').value = '';
                document.getElementById('new-park-units').value = '';
                
                // Update displays
                updateConfigurationDisplay();
                updateParkDropdown();
            }
        }

        // addStaffAccessCode - NEW COMPLETE IMPLEMENTATION
        async function addStaffAccessCode() {
            const staffName = document.getElementById('new-staff-name').value.trim();
            const staffCode = document.getElementById('new-staff-code').value.trim();
            const staffRole = document.getElementById('new-staff-role').value;
            const staffPark = document.getElementById('new-staff-park').value;
            
            // Validation
            if (!staffName) {
                showMessage('Please enter staff name', 'error');
                return;
            }
            
            if (!staffCode) {
                showMessage('Please enter staff access code', 'error');
                return;
            }
            
            if (!staffPark) {
                showMessage('Please select a park', 'error');
                return;
            }
            
            // Check if code already exists
            if (ACCESS_CODES[staffCode]) {
                showMessage('This access code already exists', 'error');
                return;
            }
            
            // Add staff code
            ACCESS_CODES[staffCode] = {
                type: 'staff',
                name: staffName,
                park: staffPark,
                role: staffRole,
                message: `Welcome ${staffName} (${staffRole})`
            };
            
            // Save to Firebase
            const saved = await saveConfiguration();
            
            if (saved) {
                showMessage(`✓ Staff code for "${staffName}" added successfully`, 'success');
                
                // Clear form
                document.getElementById('new-staff-name').value = '';
                document.getElementById('new-staff-code').value = '';
                document.getElementById('new-staff-role').selectedIndex = 0;
                document.getElementById('new-staff-park').selectedIndex = 0;
                
                // Update display
                updateConfigurationDisplay();
            }
        }

        // updateConfigurationDisplay - NEW COMPLETE IMPLEMENTATION
        function updateConfigurationDisplay() {
            const container = document.getElementById('configured-parks-container');
            
            if (Object.keys(PARK_ACCESS_CODES).length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">No parks configured yet. Add your first park above.</p>';
                return;
            }
            
            let html = '';
            
            for (const [code, parkName] of Object.entries(PARK_ACCESS_CODES)) {
                const hotTubs = HOT_TUB_DATA[parkName] || [];
                const staffList = Object.entries(ACCESS_CODES)
                    .filter(([_, data]) => data.park === parkName && data.type === 'staff');
                
                html += `
                    <div class="park-card">
                        <h4>${parkName}</h4>
                        <div class="park-info"><strong>Access Code:</strong> ${code}</div>
                        <div class="park-info"><strong>Hot Tubs:</strong> ${hotTubs.length}</div>
                        
                        ${hotTubs.length > 0 ? `
                            <div class="hot-tub-list">
                                ${hotTubs.map(ht => `<span class="hot-tub-tag">${ht}</span>`).join('')}
                            </div>
                        ` : '<div style="color: #888; font-size: 12px; margin-top: 5px;">No hot tubs assigned</div>'}
                        
                        <div style="margin-top: 15px;">
                            <strong>Staff Members (${staffList.length}):</strong>
                            ${staffList.length > 0 ? `
                                <div style="margin-top: 8px;">
                                    ${staffList.map(([staffCode, staffData]) => `
                                        <div class="staff-card">
                                            <div class="staff-info">
                                                <div class="staff-name">${staffData.name}</div>
                                                <div class="staff-details">${staffData.role} • Code: ${staffCode}</div>
                                            </div>
                                            <button class="danger" onclick="removeStaffCode('${staffCode}')">Remove</button>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<div style="color: #888; font-size: 12px; margin-top: 5px;">No staff assigned</div>'}
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <button onclick="editPark('${code}')">Edit Park</button>
                            <button class="danger" onclick="removePark('${code}')">Remove Park</button>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        // updateParkDropdown - NEW COMPLETE IMPLEMENTATION
        function updateParkDropdown() {
            const dropdown = document.getElementById('new-staff-park');
            const currentValue = dropdown.value;
            
            dropdown.innerHTML = '<option value="">-- Select Park --</option>';
            
            for (const parkName of Object.values(PARK_ACCESS_CODES)) {
                const option = document.createElement('option');
                option.value = parkName;
                option.textContent = parkName;
                dropdown.appendChild(option);
            }
            
            // Restore selection if it still exists
            if (currentValue && Object.values(PARK_ACCESS_CODES).includes(currentValue)) {
                dropdown.value = currentValue;
            }
        }

        // removeStaffCode - NEW COMPLETE IMPLEMENTATION
        async function removeStaffCode(code) {
            const staffData = ACCESS_CODES[code];
            if (!confirm(`Remove staff access code for ${staffData.name} (${code})?`)) return;
            
            delete ACCESS_CODES[code];
            
            const saved = await saveConfiguration();
            if (saved) {
                showMessage('✓ Staff code removed', 'success');
                updateConfigurationDisplay();
            }
        }

        // removePark - NEW COMPLETE IMPLEMENTATION
        async function removePark(code) {
            const parkName = PARK_ACCESS_CODES[code];
            
            if (!confirm(`Remove park "${parkName}" and all associated data?\n\nThis will also remove all staff codes for this park.`)) return;
            
            // Remove park
            delete PARK_ACCESS_CODES[code];
            delete HOT_TUB_DATA[parkName];
            delete ACCESS_CODES[code];
            
            // Remove associated staff codes
            for (const [staffCode, data] of Object.entries(ACCESS_CODES)) {
                if (data.park === parkName) {
                    delete ACCESS_CODES[staffCode];
                }
            }
            
            const saved = await saveConfiguration();
            if (saved) {
                showMessage(`✓ Park "${parkName}" removed`, 'success');
                updateConfigurationDisplay();
                updateParkDropdown();
            }
        }

        // editPark - NEW IMPLEMENTATION (placeholder for future enhancement)
        function editPark(code) {
            showMessage('Edit functionality coming soon', 'warning');
            // Future: Open modal or inline edit form
        }

        // showMessage - NEW COMPLETE IMPLEMENTATION
        function showMessage(text, type = 'success') {
            const container = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            
            container.innerHTML = ''; // Clear existing messages
            container.appendChild(messageDiv);
            
            // Auto-clear success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.remove();
                }, 5000);
            }
        }

        // clearMessages - NEW COMPLETE IMPLEMENTATION
        function clearMessages() {
            document.getElementById('message-container').innerHTML = '';
        }

        // showSection - NEW IMPLEMENTATION for future navigation
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }
    </script>
</body>
</html>
