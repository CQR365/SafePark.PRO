<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSHH Management System - SafeChem.PRO</title>
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #E8E8E8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        .btn {
            background: linear-gradient(145deg, #4a4a4a 0%, #2a2a2a 25%, #1a1a1a 50%, #2a2a2a 75%, #3a3a3a 100%);
            color: #C0C0C0;
            padding: 12px 25px;
            border: 1px solid #666;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: linear-gradient(145deg, #5a5a5a 0%, #3a3a3a 25%, #2a2a2a 50%, #3a3a3a 75%, #4a4a4a 100%);
        }
        .nav-tabs {
            display: flex;
            background: #333;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 20px;
        }
        .nav-tab {
            background: linear-gradient(145deg, #4a4a4a 0%, #2a2a2a 25%, #1a1a1a 50%, #2a2a2a 75%, #3a3a3a 100%);
            color: #C0C0C0;
            padding: 12px 20px;
            border: 1px solid #666;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 4px;
            font-weight: 600;
        }
        .nav-tab.active {
            background: #E91E63;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
        }
        .test-button {
            background: red;
            color: white;
            padding: 10px;
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span style="color: #C0C0C0;">safe</span><span style="color: #E91E63;">chem</span><span style="color: #C0C0C0;">.pro</span></h1>
            <div>COSHH Management System</div>
            <button onclick="testAlert()" class="test-button">TEST</button>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="nav-tab" onclick="switchTab('chemicals')">Chemicals</button>
            <button class="nav-tab" onclick="switchTab('assessment')">Assessment</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <h2>Dashboard</h2>
            <p>Welcome to the COSHH Management System</p>
        </div>

        <div id="chemicals" class="tab-content">
            <h2>Chemical Inventory</h2>
            <button class="btn" onclick="addNewChemical()">Add New Chemical</button>
            <button class="btn" onclick="exportChemicals()">Export Data</button>
            <div id="chemical-list">
                <p>No chemicals added yet.</p>
            </div>
        </div>

        <div id="assessment" class="tab-content">
            <h2>Risk Assessment</h2>
            <button class="btn" onclick="startAssessment()">Start Assessment</button>
            <div id="assessment-content">
                <p>Select a chemical to assess from the Chemicals tab.</p>
            </div>
        </div>
    </div>

    <script>
        console.log('🔧 MINIMAL TEST: Script starting');

        // Simple test function
        function testAlert() {
            alert('TEST FUNCTION WORKS!');
            console.log('✅ TEST: testAlert called successfully');
        }

        // Tab switching function
        function switchTab(tabName) {
            console.log('✅ TEST: switchTab called with:', tabName);
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Chemical management functions
        function addNewChemical() {
            console.log('✅ TEST: addNewChemical called');
            alert('Add New Chemical function works!');
            document.getElementById('chemical-list').innerHTML += '<p>New chemical added (demo)</p>';
        }

        function exportChemicals() {
            console.log('✅ TEST: exportChemicals called');
            alert('Export Chemicals function works!');
        }

        function startAssessment() {
            console.log('✅ TEST: startAssessment called');
            alert('Start Assessment function works!');
            document.getElementById('assessment-content').innerHTML = '<p>Assessment started (demo)</p>';
        }

        // CRITICAL: Assign ALL functions to window object IMMEDIATELY
        window.testAlert = testAlert;
        window.switchTab = switchTab;
        window.addNewChemical = addNewChemical;
        window.exportChemicals = exportChemicals;
        window.startAssessment = startAssessment;

        console.log('🔧 MINIMAL TEST: All functions assigned to window');
        console.log('✅ window.testAlert:', typeof window.testAlert);
        console.log('✅ window.switchTab:', typeof window.switchTab);
        console.log('✅ window.addNewChemical:', typeof window.addNewChemical);
        console.log('✅ window.exportChemicals:', typeof window.exportChemicals);
        console.log('✅ window.startAssessment:', typeof window.startAssessment);

        console.log('🎯 MINIMAL TEST: Script loaded successfully');
    </script>
</body>
</html>
