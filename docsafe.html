<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DocSafe.PRO - Document Management System</title>
    
    <!-- Preconnect hints for faster loading -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js" crossorigin="anonymous"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FE7F2D;
            --dark-bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-elevated: #252525;
            --surface-hover: #2a2a2a;
            --border-color: #333;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #888888;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Code Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 2px solid var(--primary-orange);
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .brand-title .doc { color: #888; }
        .brand-title .safe { color: var(--primary-orange); }
        .brand-title .pro { color: #888; }

        .firebase-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface-elevated);
            border-radius: 20px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .status-dot.connected { background: var(--success); animation: none; }
        .status-dot.error { background: var(--danger); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-orange);
            color: white;
        }

        .btn-primary:hover {
            background: #e5712a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 20px 0;
        }

        /* Category Accordion */
        .category-accordion {
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border-color);
        }

        .category-header {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .category-header:hover {
            background: var(--surface-elevated);
        }

        .category-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }

        .category-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .category-count {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 15px;
            color: white;
        }

        .category-arrow {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .category-accordion.expanded .category-arrow {
            transform: rotate(90deg);
        }

        /* Category Content (Table) */
        .category-content {
            display: none;
            background: var(--surface-elevated);
            border-top: 1px solid var(--border-color);
        }

        .category-accordion.expanded .category-content {
            display: block;
        }

        /* Document Table */
        .doc-table {
            width: 100%;
            border-collapse: collapse;
        }

        .doc-table th {
            text-align: left;
            padding: 10px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }

        .doc-table td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-table tr:last-child td {
            border-bottom: none;
        }

        .doc-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .doc-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .doc-icon {
            font-size: 18px;
        }

        .doc-filename {
            color: var(--text-primary);
            font-weight: 500;
        }

        .doc-reference {
            color: var(--text-muted);
            font-size: 11px;
            font-family: monospace;
        }

        .expiry-ok { color: var(--success); }
        .expiry-warning { color: var(--warning); }
        .expiry-danger { color: var(--danger); }
        .expiry-none { color: var(--text-muted); font-style: italic; }

        .doc-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .doc-actions button {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .doc-actions button:hover {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }

        .doc-actions button.delete:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Upload Row */
        .upload-row {
            padding: 12px 16px;
            background: rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .upload-btn {
            padding: 8px 16px;
            border: 1px dashed var(--border-color);
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
            flex: 1;
            max-width: 200px;
        }

        .upload-btn:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
            background: rgba(254, 127, 45, 0.1);
        }

        .upload-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Add Folder Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-orange);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-elevated);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-orange);
        }

        .color-picker-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: white;
            box-shadow: 0 0 0 2px var(--primary-orange);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Expiry Modal */
        .expiry-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Responsive */
        /* Tablet (768px - 1024px) */
        @media (max-width: 1024px) {
            .container {
                padding: 0 15px;
            }

            .category-header {
                padding: 12px 14px;
            }

            .doc-table th,
            .doc-table td {
                padding: 10px 12px;
            }
        }

        /* Mobile Landscape / Small Tablet (max 768px) */
        @media (max-width: 768px) {
            .header-content {
                justify-content: center;
                text-align: center;
            }

            .brand-title {
                font-size: 1.5rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .toolbar-actions {
                flex-wrap: wrap;
                justify-content: center;
            }

            .btn {
                padding: 12px 16px;
                font-size: 14px;
            }

            /* Hide expiry column on tablet */
            .doc-table th:nth-child(3),
            .doc-table td:nth-child(3) {
                display: none;
            }

            .category-desc {
                display: none;
            }

            .category-icon {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }

            .category-name {
                font-size: 14px;
            }

            /* Modal responsive */
            .modal {
                width: 95%;
                max-height: 90vh;
                overflow-y: auto;
                padding: 20px;
            }

            .modal-title {
                font-size: 16px;
            }

            .color-option {
                width: 32px;
                height: 32px;
            }
        }

        /* Mobile Portrait (max 480px) */
        @media (max-width: 480px) {
            .header {
                padding: 15px 0;
            }

            .brand-title {
                font-size: 1.3rem;
            }

            .firebase-status {
                padding: 6px 12px;
                font-size: 11px;
            }

            .toolbar-title span {
                font-size: 12px;
            }

            .btn {
                padding: 10px 12px;
                font-size: 13px;
            }

            /* Hide button text, show only icons */
            .btn span:last-child {
                display: none;
            }

            .btn span:first-child {
                margin-right: 0;
            }

            /* Hide upload date column */
            .doc-table th:nth-child(2),
            .doc-table td:nth-child(2) {
                display: none;
            }

            .doc-table th,
            .doc-table td {
                padding: 8px 10px;
                font-size: 12px;
            }

            .doc-filename {
                font-size: 12px;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .doc-reference {
                font-size: 10px;
            }

            .doc-actions button {
                padding: 8px 10px;
                font-size: 11px;
            }

            .category-header {
                padding: 12px;
            }

            .category-icon {
                width: 26px;
                height: 26px;
                margin-right: 10px;
            }

            .category-count {
                padding: 3px 8px;
                font-size: 11px;
                margin-right: 10px;
            }

            .upload-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .upload-btn {
                max-width: none;
                padding: 12px;
            }

            /* Modal adjustments */
            .modal {
                padding: 16px;
            }

            .form-group input,
            .form-group textarea {
                padding: 12px;
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions .btn {
                width: 100%;
            }

            .color-option {
                width: 40px;
                height: 40px;
            }

            /* Empty state */
            .empty-state {
                padding: 20px;
            }

            .empty-state-icon {
                font-size: 28px;
            }
        }

        /* Touch-friendly improvements */
        @media (hover: none) and (pointer: coarse) {
            .category-header {
                min-height: 60px;
            }

            .doc-actions button {
                min-width: 44px;
                min-height: 44px;
            }

            .btn {
                min-height: 44px;
            }

            .upload-btn {
                min-height: 48px;
            }

            .color-option {
                min-width: 44px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="brand-title">
                    <span class="doc">doc</span><span class="safe">safe</span><span class="pro">.pro</span>
                </h1>
                <div class="firebase-status" id="firebaseStatus">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">Connecting...</span>
                    <button id="retryBtn" onclick="retryFirebase()" style="display: none; margin-left: 8px; padding: 4px 8px; background: var(--primary-orange); border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 11px;">Retry</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-title">
                <span style="color: var(--text-muted); font-size: 14px;">Document Management System</span>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-primary" onclick="openAddFolderModal()">
                    <span>+</span> <span>Add Folder</span>
                </button>
                <button class="btn btn-secondary" onclick="expandAll()">
                    <span>▼</span> <span>Expand All</span>
                </button>
                <button class="btn btn-secondary" onclick="collapseAll()">
                    <span>▶</span> <span>Collapse All</span>
                </button>
            </div>
        </div>

        <!-- Categories Container -->
        <div id="categoriesContainer">
            <!-- Categories will be rendered here -->
        </div>
    </main>

    <!-- Add Folder Modal -->
    <div class="modal-overlay" id="addFolderModal">
        <div class="modal">
            <h3 class="modal-title">Add New Folder</h3>
            <div class="form-group">
                <label>Folder Name *</label>
                <input type="text" id="newFolderName" placeholder="e.g., COSHH Assessments">
            </div>
            <div class="form-group">
                <label>Description (optional)</label>
                <input type="text" id="newFolderDesc" placeholder="e.g., Chemical safety data sheets">
            </div>
            <div class="form-group">
                <label>Prefix (3 letters for reference codes)</label>
                <input type="text" id="newFolderPrefix" maxlength="3" placeholder="e.g., COS" style="text-transform: uppercase; width: 80px;">
            </div>
            <div class="form-group">
                <label>Color</label>
                <div class="color-picker-group" id="colorPicker">
                    <!-- Colors will be rendered here -->
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAddFolderModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addNewFolder()">Add Folder</button>
            </div>
        </div>
    </div>

    <!-- Set Expiry Modal -->
    <div class="modal-overlay" id="expiryModal">
        <div class="modal">
            <h3 class="modal-title">Set Document Expiry</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;" id="expiryDocName"></p>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="date" id="expiryDate">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExpiryModal()">Cancel</button>
                <button class="btn btn-secondary" onclick="clearExpiry()">No Expiry</button>
                <button class="btn btn-primary" onclick="saveExpiry()">Save</button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs (created dynamically) -->
    <div id="fileInputs"></div>

    <script>

        async function initializeFirebase() {
            try {
                updateStatus('Initializing...', 'connecting');
                console.log('[DocSafe] Starting Firebase initialization...');

                // Wait for Firebase scripts to load
                let attempts = 0;
                while (typeof firebase === 'undefined' && attempts < 10) {
                    console.log('[DocSafe] Waiting for Firebase scripts...');
                    await new Promise(resolve => setTimeout(resolve, 500));
                    attempts++;
                }

                if (typeof firebase === 'undefined') {
                    throw new Error('Firebase scripts failed to load');
                }

                console.log('[DocSafe] Firebase scripts loaded');

                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                    console.log('[DocSafe] Firebase app initialized');
                }

                db = firebase.firestore();
                window.db = db; // Make available globally like original
                console.log('[DocSafe] Firestore initialized');
                
                storage = firebase.storage();
                documentsRef = storage.ref('documents');
                console.log('[DocSafe] Storage initialized');
                
                // Try anonymous auth but don't fail if it doesn't work
                try {
                    const auth = firebase.auth();
                    if (!auth.currentUser) {
                        console.log('[DocSafe] Attempting anonymous sign in...');
                        await auth.signInAnonymously();
                        console.log('[DocSafe] Signed in anonymously');
                    }
                } catch (authError) {
                    console.warn('[DocSafe] Anonymous auth failed (may still work):', authError.message);
                }
                
                firebaseInitialized = true;
                updateStatus('Connected to Firebase', 'connected');
                console.log('[DocSafe] Firebase ready - loading data...');
                
                await loadCategories();
                await loadAllDocuments();
                console.log('[DocSafe] Data loaded successfully');
                
            } catch (error) {
                console.error('[DocSafe] Firebase init error:', error);
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        function updateStatus(message, state) {
            document.getElementById('statusText').textContent = message;
            const dot = document.getElementById('statusDot');
            const retryBtn = document.getElementById('retryBtn');
            
            dot.className = 'status-dot';
            if (state === 'connected') {
                dot.classList.add('connected');
                if (retryBtn) retryBtn.style.display = 'none';
            }
            if (state === 'error') {
                dot.classList.add('error');
                if (retryBtn) retryBtn.style.display = 'inline-block';
            }
            if (state === 'connecting') {
                if (retryBtn) retryBtn.style.display = 'none';
            }
        }
        
        function retryFirebase() {
            console.log('[DocSafe] Manual retry triggered');
            firebaseInitialized = false;
            initializeFirebase();
        }

        async function loadCategories() {
            try {
                console.log('[DocSafe] Loading categories from Firestore...');
                const snapshot = await db.collection('docsafe_categories').get();
                if (!snapshot.empty) {
                    const loadedCategories = [];
                    snapshot.forEach(doc => {
                        loadedCategories.push({ id: doc.id, ...doc.data() });
                    });
                    console.log('[DocSafe] Loaded', loadedCategories.length, 'custom categories');
                    // Merge with defaults, prioritizing saved
                    const savedIds = loadedCategories.map(c => c.id);
                    categories = [
                        ...loadedCategories,
                        ...categories.filter(c => !savedIds.includes(c.id))
                    ];
                } else {
                    console.log('[DocSafe] No custom categories found, using defaults');
                }
            } catch (error) {
                console.warn('[DocSafe] Could not load categories (using defaults):', error.message);
            }
            renderCategories();
        }

        async function saveCategory(category) {
            if (!firebaseInitialized) return;
            try {
                await db.collection('docsafe_categories').doc(category.id).set(category);
            } catch (error) {
                console.error('Error saving category:', error);
            }
        }

        function openAddFolderModal() {

            document.getElementById('newFolderPrefix').value = '';

            document.getElementById('addFolderModal').classList.remove('active');

        function renderColorPicker() {
            const container = document.getElementById('colorPicker');
            container.innerHTML = '';
            
            availableColors.forEach((color, index) => {
                const div = document.createElement('div');
                div.className = 'color-option' + (index === 0 ? ' selected' : '');
                div.style.background = color;
                div.onclick = () => selectColor(color, div);
                container.appendChild(div);
            });
            
            selectedColor = availableColors[0];
        }

        function selectColor(color, element) {
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedColor = color;
        }

        async function addNewFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            const desc = document.getElementById('newFolderDesc').value.trim();
            let prefix = document.getElementById('newFolderPrefix').value.trim().toUpperCase();

            if (!name) {
                alert('Please enter a folder name');
                return;
            }

            if (!prefix) {
                prefix = name.substring(0, 3).toUpperCase();
            }

            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            
            // Check for duplicate
            if (categories.find(c => c.id === id)) {
                alert('A folder with this name already exists');
                return;
            }

            const icon = name.charAt(0).toUpperCase();
            
            const newCategory = {
                id: id,
                name: name,
                desc: desc,
                prefix: prefix,
                color: selectedColor,
                icon: icon
            };

            categories.push(newCategory);
            await saveCategory(newCategory);
            
            documents[id] = [];
            renderCategories();
            closeAddFolderModal();
            
            // Expand the new category
            setTimeout(() => {
                toggleCategory(id);
            }, 100);
        }

                input.type = 'file';
                input.id = `fileInput-${categoryId}`;
                input.multiple = true;
                input.accept = '.pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.gif';
                input.style.display = 'none';
                input.onchange = (e) => handleFileUpload(e, categoryId);
                container.appendChild(input);
            }

            const input = document.getElementById(`fileInput-${categoryId}`);
            if (input) input.click();
        }

        async function handleFileUpload(event, categoryId) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (const file of files) {
                await uploadFile(file, categoryId);
            }
            
            event.target.value = '';
        }

        async function uploadFile(file, categoryId) {
            if (!firebaseInitialized) {
                alert('Firebase not connected. Please wait or refresh.');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert(`File ${file.name} is too large. Maximum size is 10MB.`);
                return;
            }

            try {
                updateStatus(`Uploading ${file.name}...`, 'connecting');

                const category = categories.find(c => c.id === categoryId);
                const reference = generateReference(category?.prefix || 'DOC');
                const timestamp = Date.now();
                const fileName = `${timestamp}_${file.name}`;
                
                const fileRef = documentsRef.child(`${categoryId}/${fileName}`);
                const snapshot = await fileRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();

                const metadata = {
                    name: file.name,
                    category: categoryId,
                    reference: reference,
                    uploadDate: new Date().toISOString(),
                    size: file.size,
                    type: file.type,
                    storagePath: snapshot.ref.fullPath,
                    downloadURL: downloadURL,
                    expiryDate: null
                };

                const docRef = await db.collection('documents').add(metadata);
                metadata.id = docRef.id;

                if (!documents[categoryId]) documents[categoryId] = [];
                documents[categoryId].push(metadata);

                renderCategories();
                
                // Re-expand the category
                document.getElementById(`category-${categoryId}`).classList.add('expanded');
                
                updateStatus('Document uploaded successfully', 'connected');

            } catch (error) {
                console.error('Upload error:', error);
                alert(`Error uploading ${file.name}: ${error.message}`);
                updateStatus('Upload failed', 'error');
            }
        }

        function generateReference(prefix) {
            const dateStr = new Date().toISOString().slice(2, 10).replace(/-/g, '');
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `${prefix}-${dateStr}-${random}`;
        }

        async function loadAllDocuments() {
            try {
                console.log('[DocSafe] Loading documents from Firestore...');
                const snapshot = await db.collection('documents').get();
                
                documents = {};
                categories.forEach(cat => {
                    documents[cat.id] = [];
                });

                let totalDocs = 0;
                snapshot.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    if (!documents[data.category]) {
                        documents[data.category] = [];
                    }
                    documents[data.category].push(data);
                    totalDocs++;
                });

                console.log('[DocSafe] Loaded', totalDocs, 'documents');

                // Sort by upload date (newest first)
                Object.keys(documents).forEach(cat => {
                    documents[cat].sort((a, b) => new Date(b.uploadDate) - new Date(a.uploadDate));
                });

                renderCategories();

            } catch (error) {
                console.error('[DocSafe] Error loading documents:', error.message);
            }
        }

        async function deleteDocument(docId, categoryId) {
            if (!confirm('Are you sure you want to delete this document?')) return;

            try {
                const doc = documents[categoryId]?.find(d => d.id === docId);
                
                if (doc?.storagePath) {
                    const fileRef = storage.ref(doc.storagePath);
                    await fileRef.delete();
                }

                await db.collection('documents').doc(docId).delete();
                
                documents[categoryId] = documents[categoryId].filter(d => d.id !== docId);
                renderCategories();
                document.getElementById(`category-${categoryId}`).classList.add('expanded');
                
                updateStatus('Document deleted', 'connected');

            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting document');
            }
        }

        async function viewDocument(docId) {
            const doc = findDocumentById(docId);
            if (doc?.downloadURL) {
                window.open(doc.downloadURL, '_blank');
            }
        }

        async function downloadDocument(docId) {
            const doc = findDocumentById(docId);
            if (doc?.downloadURL) {
                const a = document.createElement('a');
                a.href = doc.downloadURL;
                a.download = doc.name;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function findDocumentById(docId) {
            for (const categoryId in documents) {
                const doc = documents[categoryId].find(d => d.id === docId);
                if (doc) return doc;
            }
            return null;
        }

        // ============================================
        // EXPIRY MANAGEMENT
        // ============================================

        function openExpiryModal(docId) {
            currentExpiryDoc = findDocumentById(docId);
            if (!currentExpiryDoc) return;

            document.getElementById('expiryDocName').textContent = currentExpiryDoc.name;
            document.getElementById('expiryDate').value = currentExpiryDoc.expiryDate || '';
            document.getElementById('expiryModal').classList.add('active');
        }

        function closeExpiryModal() {
            document.getElementById('expiryModal').classList.remove('active');
            currentExpiryDoc = null;
        }

        async function saveExpiry() {
            if (!currentExpiryDoc) return;

            const expiryDate = document.getElementById('expiryDate').value;
            
            try {
                await db.collection('documents').doc(currentExpiryDoc.id).update({
                    expiryDate: expiryDate || null
                });

                currentExpiryDoc.expiryDate = expiryDate || null;
                renderCategories();
                
                // Re-expand the category
                document.getElementById(`category-${currentExpiryDoc.category}`).classList.add('expanded');
                
                closeExpiryModal();
                updateStatus('Expiry date updated', 'connected');

            } catch (error) {
                console.error('Error saving expiry:', error);
                alert('Error saving expiry date');
            }
        }

        async function clearExpiry() {
            document.getElementById('expiryDate').value = '';
            await saveExpiry();
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
        }

        function getExpiryClass(expiryDate) {
            if (!expiryDate) return 'expiry-none';
            
            const expiry = new Date(expiryDate);
            const today = new Date();
            const daysUntilExpiry = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

            if (daysUntilExpiry < 0) return 'expiry-danger';
            if (daysUntilExpiry <= 30) return 'expiry-warning';
            return 'expiry-ok';
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            // Render default categories immediately so UI shows even if Firebase is slow
            renderCategories();
            
            // Then try to connect to Firebase
            initializeFirebase();
            
            // Fallback: if still not connected after 10 seconds, show offline message with retry
            setTimeout(function() {
                if (!firebaseInitialized) {
                    updateStatus('Offline - tap Retry', 'error');
                    console.log('[DocSafe] Running in offline mode - Firebase did not connect in time');
                }
            }, 10000);
        });
    </script>
</body>
</html>
