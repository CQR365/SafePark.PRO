<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeSystems.PRO — Report</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--card2:#fafafa;--border:#e2e4e8;--text:#1a1a2e;--muted:#5f6577;--dim:#8a8fa3;--orange:#CC5500;--green:#0d9668;--red:#d92d20;--amber:#dc6803;--blue:#1570ef;--pink:#f492f0;--cyan:#0dcaf0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5}
.controls{max-width:900px;margin:30px auto;padding:24px 28px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.controls h2{font-size:22px;color:var(--text);margin-bottom:16px}.controls h2 span{color:var(--orange)}
.ctrl-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;align-items:end}
.ctrl-group{display:flex;flex-direction:column;gap:4px}
.ctrl-group label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.ctrl-group select,.ctrl-group input{background:#fff;border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;font-family:inherit}
.ctrl-group select{min-width:200px}
.ctrl-group textarea{background:#fff;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px;font-family:inherit;width:100%;min-height:70px;resize:vertical}
.btn-gen{background:var(--orange);color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}.btn-gen:hover{background:#e06500}.btn-gen:disabled{opacity:.5;cursor:wait}
.btn-print{background:transparent;color:var(--orange);border:2px solid var(--orange);padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-left:12px}.btn-print:hover{background:var(--orange);color:#fff}
.status-msg{font-size:13px;color:var(--muted);margin-top:8px}
.report{max-width:1100px;margin:0 auto 60px;display:none}
@media print{.controls{display:none!important}.report{display:block!important;max-width:100%;margin:0}.rpt-section{break-inside:avoid;page-break-inside:avoid}.rpt-exec{break-inside:auto;page-break-inside:auto}.personal-note{break-inside:auto;page-break-inside:auto}.reels{break-inside:avoid;page-break-inside:avoid}.dtable{font-size:11px}.dtable thead{display:table-header-group}.dtable tbody tr{break-inside:avoid;page-break-inside:avoid}.rpt-header{break-inside:avoid;page-break-inside:avoid}.narrative{break-inside:avoid;page-break-inside:avoid}@page{size:A3 landscape;margin:12mm 16mm}body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.rpt-header{padding:20px 28px;background:#1a1a2e;border:1px solid #1a1a2e;border-radius:12px;margin-bottom:20px;display:flex;align-items:center;gap:20px}
.rpt-header img{height:60px;border-radius:8px}
.rpt-header .titles h1{font-size:24px;color:#fff;font-weight:700}.rpt-header .titles h1 span{color:var(--orange)}
.rpt-header .titles .sub{font-size:14px;color:rgba(255,255,255,.6)}
.rpt-header .meta{margin-left:auto;text-align:right}
.rpt-header .meta .park-name{font-size:18px;font-weight:700;color:var(--orange)}.rpt-header .meta .period{font-size:13px;color:rgba(255,255,255,.6)}
.rpt-exec{padding:20px 28px;background:#fff8f3;border:2px solid var(--orange);border-radius:12px;margin-bottom:20px}
.rpt-exec h3{font-size:16px;color:var(--orange);margin-bottom:8px;font-weight:700}
.rpt-exec p,.rpt-exec div{font-size:15px;color:#3d3d4e;line-height:1.6}
.rpt-exec .personal-note{border-top:2px solid var(--orange);padding-top:14px;margin-top:14px;color:var(--text);font-size:14px;line-height:1.8}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.reel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.reel-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.reel-value{font-size:48px;font-weight:800;line-height:1}
.reel-bar{height:5px;background:#eef0f3;border-radius:4px;margin:12px 0;overflow:hidden}
.reel-fill{height:100%;border-radius:4px}
.reel-delta{font-size:13px;font-weight:600;margin-top:4px}.reel-sub{font-size:12px;color:var(--dim);margin-top:4px}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}.delta-flat{color:var(--dim)}
.trend-row{display:flex;justify-content:center;gap:4px;margin-top:8px}
.trend-dot{width:8px;height:8px;border-radius:50%;opacity:.4}.trend-dot.active{opacity:1}
.rpt-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rpt-section h3{font-size:17px;color:var(--text);font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.rpt-section h3 span{color:var(--orange)}
.badge{font-size:11px;padding:2px 10px;border-radius:12px;margin-left:8px;font-weight:600;vertical-align:middle}
.badge-ok{background:#ecfdf3;color:var(--green)}.badge-warn{background:#fef6ee;color:var(--amber)}.badge-alert{background:#fef3f2;color:var(--red)}.badge-info{background:#eff4ff;color:var(--blue)}.badge-gap{background:#f2f4f7;color:var(--dim)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.metric .m-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.metric .m-value{font-size:28px;font-weight:800;color:var(--text);line-height:1.1}
.metric .m-delta{font-size:12px;font-weight:600;margin-top:4px}.metric .m-sub{font-size:11px;color:var(--dim);margin-top:2px}
.narrative{font-size:14px;color:#3d3d4e;line-height:1.6;padding:12px 16px;background:#fafbfc;border-radius:8px;border-left:3px solid var(--orange);margin-top:10px}
.narrative.alert{border-left-color:var(--red);background:#fef3f2}.narrative.good{border-left-color:var(--green);background:#ecfdf3}.narrative.warn{border-left-color:var(--amber);background:#fef6ee}
.dtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.dtable th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);background:#fafbfc}
.dtable td{padding:8px 12px;border-bottom:1px solid #f0f1f3;color:var(--text)}.dtable tr:last-child td{border-bottom:none}
.dtable tr:hover{background:#fafbfc}
.data-gap{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fef3f2;border:1px dashed #fecdca;border-radius:8px;margin-top:10px}
.data-gap-icon{width:20px;height:20px;border-radius:50%;background:#fef3f2;border:1px solid #fecdca;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red);font-weight:700;flex-shrink:0}
.data-gap-text{font-size:13px;color:#5f2120}
.safety-callout{background:#fef3f2;border:1px solid #fecdca;border-radius:8px;padding:14px 16px;margin-top:12px}
.safety-callout h4{font-size:13px;color:var(--red);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.safety-callout p{font-size:13px;color:#3d3d4e;line-height:1.5}
.rpt-recs{padding:20px 28px;background:#ecfdf3;border:2px solid var(--green);border-radius:12px;margin-bottom:20px}
.overall-score{background:linear-gradient(135deg,#1a1a2e,#2d2d4e);border-radius:12px;padding:24px 28px;margin-bottom:20px;text-align:center;break-inside:avoid;page-break-inside:avoid}
.overall-score .os-value{font-size:72px;font-weight:800;line-height:1;margin:8px 0}
.overall-score .os-label{font-size:14px;color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.overall-score .os-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:8px}
.overall-score .os-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin:16px auto 0;max-width:400px;overflow:hidden}
.overall-score .os-fill{height:100%;border-radius:4px}
.rpt-recs h3{font-size:16px;color:var(--green);margin-bottom:12px;font-weight:700}
.rec-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;break-inside:avoid;page-break-inside:avoid}
.rec-num{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.rec-critical .rec-num{background:#fef3f2;color:var(--red);border:1px solid #fecdca}
.rec-high .rec-num{background:#fef6ee;color:var(--amber);border:1px solid #fddcab}
.rec-medium .rec-num{background:#eff4ff;color:var(--blue);border:1px solid #c7d7fe}
.rec-text{font-size:14px;color:#3d3d4e;line-height:1.5}.rec-text strong{color:var(--text)}
.rpt-recs .personal-note{border-top:1px solid #a6f4c5;padding-top:12px;margin-top:14px;font-style:italic;color:var(--muted);font-size:14px;line-height:1.6}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.reels{grid-template-columns:1fr}}
</style>
</head>

<div class="controls" id="controlPanel">

# Hot Tub Water Sampling
Highland Holidays will now be formally outsourcing...

// Save/Load notes to localStorage
function saveNotes(){
    const park=document.getElementById('selPark').value;
    const month=document.getElementById('selMonth').value;
    const key='ssp_notes_'+park+'_'+month;
    const data={exec:document.getElementById('execNotes').value,recs:document.getElementById('recsNotes').value};
    localStorage.setItem(key,JSON.stringify(data));

    document.getElementById('saveStatus').textContent='✓ Saved';
    setTimeout(()=>{document.getElementById('saveStatus').textContent=''},3000);
}
function loadNotes(){
    const park=document.getElementById('selPark').value;
    const month=document.getElementById('selMonth').value;
    const key='ssp_notes_'+park+'_'+month;
    let data=localStorage.getItem(key);
    if(!data)data=localStorage.getItem('ssp_notes_latest');
    if(data){const d=JSON.parse(data);document.getElementById('execNotes').value=d.exec||'';document.getElementById('recsNotes').value=d.recs||'';

        setTimeout(()=>{document.getElementById('saveStatus').textContent=''},3000);

function initFB(){try{if(!firebase.apps.length)firebase.initializeApp(FBC);db=firebase.firestore();return true}catch(e){return false}}
function isDone(s){if(!s)return false;const l=s.toLowerCase();return['completed','complete','closed','resolved','done','fixed','actioned'].some(x=>l.includes(x))}
function toDate(v){if(!v)return null;if(v.toDate)return v.toDate();if(v.seconds)return new Date(v.seconds*1000);const d=new Date(v);return isNaN(d)?null:d}
function matchPark(r,park){const key=park.toLowerCase().split(' ')[0];return[r.park,r.location,r.parkName,r.parkLocation,r.site,r.holiday_park,r.holidayPark].filter(Boolean).some(v=>v.toLowerCase().includes(key))}
function pct(n,d){return d>0?Math.round(n/d*100):0}
function D(c,p){const d=c-p;if(d>0)return{val:'+'+d,cls:'delta-up',arrow:'▲'};if(d<0)return{val:''+d,cls:'delta-down',arrow:'▼'};return{val:'0',cls:'delta-flat',arrow:'—'}}
function DP(c,p){const d=c-p;if(d>0)return{val:'+'+d+'%',cls:'delta-up',arrow:'▲'};if(d<0)return{val:d+'%',cls:'delta-down',arrow:'▼'};return{val:'0%',cls:'delta-flat',arrow:'—'}}
function MN(d){return d.toLocaleString('en-GB',{month:'long',year:'numeric'})}
function SM(d){return d.toLocaleString('en-GB',{month:'short'})}
function MR(y,m){return{start:new Date(y,m,1),end:new Date(y,m+1,1)}}
function SB(v,ok,warn){if(v>=ok)return'<span class="badge badge-ok">On Track</span>';if(v>=warn)return'<span class="badge badge-warn">Attention</span>';return'<span class="badge badge-alert">Action Required</span>'}
function GB(){return'<span class="badge badge-gap">No Data</span>'}
function gap(pn,text){return'<div class="data-gap"><div class="data-gap-icon">!</div><div class="data-gap-text">'+pn+' '+text+'</div></div>'}
function fmtNotes(txt){if(!txt)return'';return txt.split('\n').map(line=>{const t=line.trim();if(!t)return'<div style="height:6px"></div>';if(t.startsWith('# ')){return'<div style="font-weight:700;font-size:15px;color:var(--text);padding:12px 0 4px 0;border-bottom:1px solid var(--border);margin-top:10px">'+t.substring(2)+'</div>'}if(t.startsWith('•')||t.startsWith('·')||t.startsWith('- ')){return'<div style="padding:4px 0 4px 16px;border-left:3px solid var(--orange);margin:3px 0;line-height:1.7;font-size:14px">'+t.replace(/^[•·]\s*/,'').replace(/^- /,'')+'</div>'}return'<div style="padding:3px 0;line-height:1.7;font-size:14px">'+t+'</div>'}).join('')}

// =============================================
// NARRATIVE ENGINE — Executive Summary
// =============================================
function buildExecSummary(pn,currName,prevName,d){
    const L=[];
    const mp=pct(d.maint.curr.done,d.maint.curr.total);
    const mpp=pct(d.maint.prev.done,d.maint.prev.total);
    const htE=d.ht.expected*d.ht.daysInMonth;
    const htP=htE>0?pct(d.ht.curr.records,htE):0;

    // Maintenance narrative
    if(d.maint.curr.total>0){
        if(mp>mpp)L.push(pn+' maintenance completion improved from '+mpp+'% to '+mp+'% month-on-month, with '+d.maint.curr.done+' of '+d.maint.curr.total+' jobs completed.');
        else if(mp<mpp)L.push(pn+' maintenance completion dropped from '+mpp+'% to '+mp+'%. '+d.maint.curr.total+' jobs were raised but only '+d.maint.curr.done+' completed — '+(d.maint.curr.total-d.maint.curr.done)+' remain open.');
        else L.push(pn+' maintained a '+mp+'% maintenance completion rate ('+d.maint.curr.done+'/'+d.maint.curr.total+'), consistent with '+prevName.split(' ')[0]+'.');
        if(d.maint.curr.responseTimes.length>0){const avg=Math.round(d.maint.curr.responseTimes.reduce((a,b)=>a+b,0)/d.maint.curr.responseTimes.length);L.push('Average response time was '+avg+' hours across '+d.maint.curr.responseTimes.length+' completed jobs with timestamps.')}
    }else{L.push(pn+' logged zero maintenance records in '+currName+'. This is a significant data gap — if work is being completed on paper or verbally, those records are lost and cannot be used as evidence of compliance.')}

    // Safety-flagged
    if(d.maint.curr.safety>0){const sp=pct(d.maint.curr.safetyDone,d.maint.curr.safety);if(sp<100)L.push(d.maint.curr.safety+' job(s) were flagged as having safety implications — '+d.maint.curr.safetyDone+' completed ('+sp+'%). Outstanding safety-flagged jobs must be prioritised.');else L.push('All '+d.maint.curr.safety+' safety-flagged maintenance jobs were completed — good practice.')}

    // Incidents
    if(d.inc.curr.total>0){
        let t=d.inc.curr.total+' incident(s) reported';
        if(d.inc.curr.riddor>0)t+=' including '+d.inc.curr.riddor+' RIDDOR reportable';
        t+='.';
        const open=d.inc.curr.total-d.inc.curr.closed;
        if(open>0)t+=' '+open+' remain open and require investigation.';else t+=' All investigated and closed.';
        L.push(t);
    }else{L.push('No incidents reported in '+currName+'. If accurate, this reflects positively on the safety culture. If incidents occurred but were not logged, this is a reporting gap that undermines the park\'s legal defence in any future claim.')}

    // Hot tubs
    if(d.ht.expected>0){
        if(htP>=90)L.push('Hot tub compliance strong at '+htP+'% — '+d.ht.curr.records+' of '+htE+' expected daily inspections logged.');
        else if(htP>=60)L.push('Hot tub compliance at '+htP+'% — '+d.ht.curr.records+' of '+htE+' expected inspections. '+(htE-d.ht.curr.records)+' inspections missed. This requires immediate improvement.');
        else if(d.ht.curr.records>0)L.push('Hot tub compliance critically low at '+htP+'%. '+d.ht.expected+' tubs × '+d.ht.daysInMonth+' days = '+htE+' expected. Only '+d.ht.curr.records+' logged. '+(htE-d.ht.curr.records)+' missed inspections.');
        else L.push(pn+' logged zero hot tub inspections despite having '+d.ht.expected+' registered tub(s). This is a significant compliance failure carrying legionella risk.');
    }

    // Play parks — 1 per park, daily inspection required
    const ppExec=d.ht.daysInMonth;const ppPctExec=ppExec>0?pct(d.pp.curr.total,ppExec):0;
    if(d.pp.curr.total===0)L.push(pn+' logged zero play park inspections in '+currName+'. 1 play area requires daily inspection — '+ppExec+' inspections expected, none completed.');
    else if(ppPctExec<90)L.push('Play park inspections at '+ppPctExec+'% — '+d.pp.curr.total+' of '+ppExec+' expected daily inspections. '+(ppExec-d.pp.curr.total)+' missed.');
    else L.push('Play park inspections strong at '+ppPctExec+'% — '+d.pp.curr.total+' of '+ppExec+' expected daily inspections completed.');

    // Accommodation — expected from config, count unique units inspected
    if(d.accom.expected>0){const acU=d.accom.curr.units.size;const acPctE=pct(acU,d.accom.expected);
        if(acU===0)L.push(pn+' completed zero accommodation safety inspections. '+d.accom.expected+' units registered — each requires a monthly safety inspection.');
        else if(acPctE>=90)L.push('Accommodation inspections strong at '+acPctE+'% — '+acU+' of '+d.accom.expected+' units inspected across '+d.accom.curr.total+' record(s).');
        else L.push('Accommodation inspections at '+acPctE+'% — '+acU+' of '+d.accom.expected+' units inspected. '+(d.accom.expected-acU)+' unit(s) still require monthly safety inspection.');
    }

    // Actions overdue
    if(d.act.overdue>0)L.push(d.act.overdue+' action(s) are currently overdue past their target date and require immediate attention.');

    // Module gaps
    const gaps=[];
    if(d.gas.total===0)gaps.push('SafeGas (gas appliances)');
    if(d.fire.extinguishers===0)gaps.push('SafeFire (extinguishers)');
    if(d.coshh.total===0)gaps.push('SafeChem (COSHH)');
    if(d.veh.total===0)gaps.push('SafeVehicle (fleet)');
    if(d.contr.total===0)gaps.push('SafeContractor');
    if(d.staff.count===0)gaps.push('SafeTeam (staff)');
    if(gaps.length>0)L.push(pn+' has zero records in: '+gaps.join(', ')+'. These data gaps must be addressed to maintain compliance visibility across all safety modules.');

    return L.join(' ');
}

// =============================================
// NARRATIVE ENGINE — Per-Section Narratives
// =============================================
function narrate(section,pn,currName,prevName,d){
    const pm=prevName.split(' ')[0];
    switch(section){

    case 'maint':{
        if(d.maint.curr.total===0)return{t:pn+' added zero maintenance records in '+currName+'. If maintenance jobs are being raised and completed on paper, this data is lost and cannot be used as evidence of compliance. Every job must go through SafeSystems.PRO.',c:'alert'};
        const p=pct(d.maint.curr.done,d.maint.curr.total),pp=pct(d.maint.prev.done,d.maint.prev.total);
        const cats=Object.entries(d.maint.curr.byCat).sort((a,b)=>b[1]-a[1]);
        let t=p>=80?'Solid performance — ':'Completion rate needs improvement — ';
        if(p>pp)t+='up '+Math.abs(p-pp)+' points from '+pm+'. ';else if(p<pp)t+='down '+Math.abs(p-pp)+' points from '+pm+' — investigate cause. ';else t+='steady vs '+pm+'. ';
        if(cats.length>0)t+='Top category: '+cats[0][0]+' ('+cats[0][1]+' jobs, '+pct(cats[0][1],d.maint.curr.total)+'%). ';
        if(d.maint.curr.responseTimes.length>0){const avg=Math.round(d.maint.curr.responseTimes.reduce((a,b)=>a+b,0)/d.maint.curr.responseTimes.length);t+=avg>72?'Average response '+avg+'h exceeds 72h target — review prioritisation.':'Average response '+avg+'h is within target.'}
        return{t,c:p>=80?'good':p>=50?'warn':'alert'};
    }

    case 'inc':{
        if(d.inc.curr.total===0)return{t:'No incidents reported by '+pn+' in '+currName+'. If accurate, this reflects effective controls and a positive safety culture. If incidents occurred but were not recorded, this is a serious reporting gap — unreported incidents cannot be investigated and the park loses its legal defence of demonstrating timely action.',c:'warn'};
        const open=d.inc.curr.total-d.inc.curr.closed;
        let t=d.inc.curr.total+' incident(s) reported. ';
        if(d.inc.curr.riddor>0)t+=d.inc.curr.riddor+' RIDDOR reportable — verify HSE notification submitted within statutory deadlines. ';
        if(open>0)t+=open+' remain open — investigation and closure required. ';else t+='All closed within reporting period. ';
        const dlt=d.inc.curr.total-d.inc.prev.total;
        if(dlt>2)t+='Incidents up '+dlt+' vs '+pm+' — assess whether this reflects improved reporting or emerging risks.';
        else if(dlt<-2)t+='Incidents down '+Math.abs(dlt)+' vs '+pm+'.';
        return{t,c:d.inc.curr.riddor>0||open>0?'alert':'good'};
    }

    case 'ht':{
        const exp=d.ht.expected*d.ht.daysInMonth;const p=exp>0?pct(d.ht.curr.records,exp):0;
        if(d.ht.expected===0)return{t:'No hot tubs registered in the accommodation config for '+pn+'. If hot tubs exist on this park, they must be added to the system immediately.',c:'warn'};
        if(d.ht.curr.records===0)return{t:pn+' logged zero hot tub inspections in '+currName+' despite '+d.ht.expected+' registered tub(s). '+exp+' daily inspections were expected. Every hot tub must be tested daily for chemical balance and temperature — failure carries serious legionella risk and potential enforcement action.',c:'alert'};
        const missed=exp-d.ht.curr.records;
        let t=d.ht.curr.records+' of '+exp+' expected inspections ('+p+'%). ';
        if(missed>0)t+=missed+' missed. ';
        if(d.ht.curr.failures>0)t+=d.ht.curr.failures+' failure(s) recorded. ';
        if(d.ht.curr.retests>0)t+=d.ht.curr.retests+' retest(s). ';
        if(d.ht.curr.records>d.ht.prev.records)t+='Up from '+d.ht.prev.records+' in '+pm+' — improving.';
        else if(d.ht.curr.records<d.ht.prev.records)t+='Down from '+d.ht.prev.records+' in '+pm+' — declining.';
        return{t,c:p>=90?'good':p>=60?'warn':'alert'};
    }

    case 'accom':{
        if(d.accom.curr.total===0)return{t:pn+' completed zero accommodation safety inspections in '+currName+'. '+d.accom.expected+' units registered — each requires a monthly safety inspection.',c:'alert'};
        const acU=d.accom.curr.units.size;const acE=d.accom.expected;const acPct=acE>0?pct(acU,acE):0;
        let t=acU+' of '+acE+' units inspected ('+acPct+'%) across '+d.accom.curr.total+' inspection record(s). ';
        if(acE-acU>0)t+=(acE-acU)+' unit(s) not yet inspected this month. ';
        if(d.accom.curr.actionsRequired>0)t+=d.accom.curr.actionsRequired+' flagged action(s). ';
        if(d.accom.curr.total>d.accom.prev.total)t+='Up from '+d.accom.prev.total+' records in '+pm+'.';
        else if(d.accom.curr.total<d.accom.prev.total)t+='Down from '+d.accom.prev.total+' records in '+pm+'.';
        return{t,c:acPct>=90?'good':acPct>=50?'warn':'alert'};
    }

    case 'pp':{
        const ppExp=d.ht.daysInMonth; // 1 play park × days in month
        const ppPct=ppExp>0?pct(d.pp.curr.total,ppExp):0;
        if(d.pp.curr.total===0)return{t:pn+' logged zero play park inspections in '+currName+'. 1 play area × '+ppExp+' days = '+ppExp+' inspections expected. Play areas require daily visual inspection before public use — legal requirement under BS EN 1176/1177. Failure to inspect exposes the park to significant liability.',c:'alert'};
        const missed=ppExp-d.pp.curr.total;
        let t=d.pp.curr.total+' of '+ppExp+' expected daily inspections completed ('+ppPct+'%). ';
        if(missed>0)t+=missed+' inspection(s) missed. ';
        if(d.pp.curr.actionsRequired>0)t+=d.pp.curr.actionsRequired+' flagged actions required. ';
        if(d.pp.curr.total>d.pp.prev.total)t+='Up from '+d.pp.prev.total+' in '+pm+' — improving.';
        else if(d.pp.curr.total<d.pp.prev.total)t+='Down from '+d.pp.prev.total+' in '+pm+' — investigate rota gaps.';
        return{t,c:ppPct>=90?'good':ppPct>=60?'warn':'alert'};
    }

    }return null;
}

// =============================================
// NARRATIVE ENGINE — Recommendations
// =============================================
function buildRecs(pn,d){
    const R=[];
    const htE=d.ht.expected*d.ht.daysInMonth;
    const htP=htE>0?pct(d.ht.curr.records,htE):0;
    const mp=pct(d.maint.curr.done,d.maint.curr.total);

    // CRITICAL
    if(d.maint.curr.total===0)R.push({p:'critical',t:'<strong>'+pn+' maintenance recording:</strong> Zero records logged. All maintenance must be captured through SafeSystems.PRO — paper records have no audit trail and cannot be used as evidence of timely action.'});
    if(d.ht.expected>0&&htP<60)R.push({p:'critical',t:'<strong>'+pn+' hot tub compliance:</strong> '+htP+'% is critically below the required daily testing standard. Every tub must be tested every day. This carries legionella risk and enforcement exposure.'});
    if(d.inc.curr.riddor>0)R.push({p:'critical',t:'<strong>RIDDOR incidents:</strong> '+d.inc.curr.riddor+' reportable incident(s) — verify HSE notifications were submitted within statutory deadlines and investigations are complete.'});
    if(d.act.overdue>0)R.push({p:'critical',t:'<strong>Overdue actions:</strong> '+d.act.overdue+' action(s) past target date. Overdue actions represent uncontrolled risk. Immediate closure or formal extension with documented justification required.'});
    const safeOpen=d.maint.curr.safety-d.maint.curr.safetyDone;
    if(safeOpen>0)R.push({p:'critical',t:'<strong>Safety-flagged maintenance:</strong> '+safeOpen+' job(s) with safety implications remain open. These must take priority over routine maintenance.'});
    if(d.fire.overdue>0)R.push({p:'critical',t:'<strong>Fire extinguisher servicing:</strong> '+d.fire.overdue+' extinguisher(s) overdue at '+pn+'. Out-of-date fire equipment is an enforcement risk — arrange servicing immediately.'});
    if(d.gas.overdue>0)R.push({p:'critical',t:'<strong>Gas inspections overdue:</strong> '+d.gas.overdue+' appliance(s) at '+pn+' past inspection date. Arrange qualified Gas Safe engineer visits.'});
    if(d.veh.motOverdue>0||d.veh.insOverdue>0)R.push({p:'critical',t:'<strong>Vehicle compliance:</strong> '+(d.veh.motOverdue>0?d.veh.motOverdue+' MOT(s) overdue. ':'')+(d.veh.insOverdue>0?d.veh.insOverdue+' insurance(s) expired. ':'')+'Vehicles must not be operated until compliance is restored.'});

    // HIGH
    if(d.gas.total===0)R.push({p:'high',t:'<strong>'+pn+' gas safety:</strong> Zero appliances registered in SafeGas. If this park uses LPG, mains gas, or any gas appliances, every appliance needs registering with service and inspection dates.'});
    if(d.fire.extinguishers===0)R.push({p:'high',t:'<strong>'+pn+' fire safety:</strong> Zero fire extinguishers registered. All fire fighting equipment must be logged with service dates and run-out dates.'});
    if(d.ht.expected>0&&htP>=60&&htP<90)R.push({p:'high',t:'<strong>'+pn+' hot tub testing:</strong> '+htP+'% compliance is below the 90% target. '+(htE-d.ht.curr.records)+' inspections missed. Identify which days/tubs are being missed and address rota gaps.'});
    if(d.coshh.total===0)R.push({p:'high',t:'<strong>'+pn+' COSHH:</strong> Zero substances registered. Every cleaning product, chemical, and hazardous substance on park must have a COSHH assessment on file.'});
    if(d.coshh.overdue>0)R.push({p:'high',t:'<strong>COSHH reviews overdue:</strong> '+d.coshh.overdue+' substance(s) at '+pn+' past review date. Update assessments and verify SDS sheets are current.'});
    if(d.pp.curr.total===0)R.push({p:'high',t:'<strong>'+pn+' play park inspections:</strong> Zero of '+d.ht.daysInMonth+' expected daily inspections completed. Play areas require daily inspection before public use — legal requirement under BS EN 1176/1177.'});
    else{const ppR=pct(d.pp.curr.total,d.ht.daysInMonth);if(ppR<90)R.push({p:'high',t:'<strong>'+pn+' play park inspections:</strong> '+ppR+'% compliance ('+d.pp.curr.total+'/'+d.ht.daysInMonth+'). '+(d.ht.daysInMonth-d.pp.curr.total)+' daily inspections missed. Identify rota gaps.'})}
    if(d.maint.curr.total>0&&mp<80)R.push({p:'high',t:'<strong>Maintenance completion:</strong> '+mp+'% is below the 80% target at '+pn+'. Review open jobs and prioritise by safety implication and age.'});

    // MEDIUM
    if(d.veh.total===0)R.push({p:'medium',t:'<strong>'+pn+' fleet registration:</strong> Zero vehicles registered. Vehicles, buggies, mowers, and plant equipment must be added with MOT, insurance, and service dates.'});
    if(d.contr.total===0)R.push({p:'medium',t:'<strong>'+pn+' contractor management:</strong> Zero contractors registered. All contractors working on park should have valid insurance, qualifications, and method statements on file.'});
    if(d.staff.count===0)R.push({p:'medium',t:'<strong>'+pn+' staff records:</strong> Zero employees in SafeTeam. Staff records, emergency contacts, training history, and competency assessments should be maintained.'});
    R.push({p:'medium',t:'<strong>SafeSpray (Legionella):</strong> No park has started using this module. Legionella risk assessments, shower head descaling records, and water outlet flushing logs are recommended across all sites.'});
    if(d.fire.firePoints===0)R.push({p:'medium',t:'<strong>'+pn+' fire points:</strong> Zero fire points registered. Fire point locations, contents, and signage should be documented.'});
    if(d.accom.curr.total===0&&d.accom.expected>0)R.push({p:'medium',t:'<strong>'+pn+' accommodation inspections:</strong> Zero of '+d.accom.expected+' units inspected this month. Every accommodation unit requires a monthly safety inspection.'});
    else if(d.accom.expected>0){const ap=pct(d.accom.curr.units.size,d.accom.expected);if(ap<90)R.push({p:ap<50?'high':'medium',t:'<strong>'+pn+' accommodation inspections:</strong> '+d.accom.curr.units.size+' of '+d.accom.expected+' units inspected ('+ap+'%). '+(d.accom.expected-d.accom.curr.units.size)+' units still require monthly safety inspection.'})}

    return R;
}

// =============================================
// DATA COLLECTION
// =============================================
// Extract park data from pre-loaded snapshots
function collectData(park,snaps,curr,prev,m3,m2,nowDate){
    const d={};
    // MAINTENANCE
    d.maint={curr:{total:0,done:0,safety:0,safetyDone:0,byCat:{},byPriority:{},responseTimes:[]},prev:{total:0,done:0,safety:0,safetyDone:0},m3:{total:0,done:0},m2:{total:0,done:0}};
    snaps.maint.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.createdAt||r.dateSubmitted||r.dateCreated);
        const isSafe=r.safetyImplication==='yes'||r.isSafetyIssue;const done=isDone(r.status);
        if(cd&&cd>=curr.start&&cd<curr.end){
            d.maint.curr.total++;if(done)d.maint.curr.done++;
            if(isSafe){d.maint.curr.safety++;if(done)d.maint.curr.safetyDone++}
            d.maint.curr.byCat[r.category||'General']=(d.maint.curr.byCat[r.category||'General']||0)+1;
            d.maint.curr.byPriority[(r.priority||'normal').toLowerCase()]=(d.maint.curr.byPriority[(r.priority||'normal').toLowerCase()]||0)+1;
            const comp=toDate(r.completedAt||r.dateCompleted||r.completionDate);
            if(cd&&comp&&done){const h=(comp-cd)/36e5;if(h>0&&h<720)d.maint.curr.responseTimes.push(h)}
        }
        if(cd&&cd>=prev.start&&cd<prev.end){d.maint.prev.total++;if(done)d.maint.prev.done++;if(isSafe){d.maint.prev.safety++;if(done)d.maint.prev.safetyDone++}}
        if(cd&&cd>=m3.start&&cd<m3.end){d.maint.m3.total++;if(done)d.maint.m3.done++}
        if(cd&&cd>=m2.start&&cd<m2.end){d.maint.m2.total++;if(done)d.maint.m2.done++}
    });
    // INCIDENTS
    d.inc={curr:{total:0,closed:0,riddor:0,types:{}},prev:{total:0,closed:0}};
    snaps.inc.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.createdAt||r.dateReported||r.date);
        const closed=(r.status||'').toLowerCase().includes('closed')||r.currentStage===5;
        if(cd&&cd>=curr.start&&cd<curr.end){d.inc.curr.total++;if(closed)d.inc.curr.closed++;if(r.riddor||r.isRiddor)d.inc.curr.riddor++;const typ=r.incident_type||r.type||'Other';d.inc.curr.types[typ]=(d.inc.curr.types[typ]||0)+1}
        if(cd&&cd>=prev.start&&cd<prev.end){d.inc.prev.total++;if(closed)d.inc.prev.closed++}
    });
    // HOT TUBS
    let expectedTubs=0;
    snaps.acCfg.forEach(doc=>{const r=doc.data();if(matchPark(r,park)){const t=r.hotTubs||r.hot_tubs||r.tubCount;if(typeof t==='number')expectedTubs=t;else if(Array.isArray(t))expectedTubs=t.length}});
    d.ht={curr:{records:0,tubs:new Set(),failures:0,retests:0},prev:{records:0},expected:expectedTubs,daysInMonth:Math.round((curr.end-curr.start)/864e5)};
    snaps.ht.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.createdAt||r.inspectionDate);const tubs=r.hotTubs||[r.hotTub||''];
        if(cd&&cd>=curr.start&&cd<curr.end){d.ht.curr.records++;tubs.forEach(t=>{if(t)d.ht.curr.tubs.add(t)});if((r.overallStatus||'').toLowerCase().includes('fail')||r.actionRequired)d.ht.curr.failures++;if((r.type||'').toLowerCase().includes('retest'))d.ht.curr.retests++}
        if(cd&&cd>=prev.start&&cd<prev.end)d.ht.prev.records++;
        if(!expectedTubs)tubs.forEach(t=>{if(t)d.ht.curr.tubs.add(t)});
    });
    if(!expectedTubs&&d.ht.curr.tubs.size>0)d.ht.expected=d.ht.curr.tubs.size;
    // ACCOMMODATION
    let accomExpected=0;
    snaps.acCfg.forEach(doc=>{const r=doc.data();if(matchPark(r,park)){if(r.totalUnits)accomExpected=r.totalUnits}});
    d.accom={curr:{total:0,actionsRequired:0,units:new Set()},prev:{total:0,units:new Set()},expected:accomExpected};
    snaps.acIns.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.submittedAt||r.createdAt||r.inspectionDate);
        const unitStr=r.accommodationUnit||r.unitName||'';
        const unitList=unitStr.split(',').map(u=>u.trim()).filter(Boolean);
        if(cd&&cd>=curr.start&&cd<curr.end){d.accom.curr.total++;if(r.actionRequired)d.accom.curr.actionsRequired++;unitList.forEach(u=>d.accom.curr.units.add(u))}
        if(cd&&cd>=prev.start&&cd<prev.end){d.accom.prev.total++;unitList.forEach(u=>d.accom.prev.units.add(u))}
    });
    // PLAY PARKS
    d.pp={curr:{total:0,actionsRequired:0,parks:new Set()},prev:{total:0}};
    snaps.pp.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.timestamp||r.createdAt||r.inspectionDate||r.date);
        if(cd&&cd>=curr.start&&cd<curr.end){d.pp.curr.total++;if(r.actionRequired)d.pp.curr.actionsRequired++;const p=r.playParkName||r.parkName||r.area||'';if(p)d.pp.curr.parks.add(p)}
        if(cd&&cd>=prev.start&&cd<prev.end)d.pp.prev.total++;
    });
    // FIRE
    d.fire={extinguishers:0,overdue:0,runOut:0,firePoints:0,fra:0,inspections:0,failures:0};
    snaps.fe.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;d.fire.extinguishers++;if(r.nextServiceDue&&new Date(r.nextServiceDue)<nowDate)d.fire.overdue++;if(r.runOutDate&&new Date(r.runOutDate)<nowDate)d.fire.runOut++});
    snaps.fp.forEach(doc=>{if(matchPark(doc.data(),park))d.fire.firePoints++});
    snaps.fra.forEach(doc=>{if(matchPark(doc.data(),park))d.fire.fra++});
    snaps.fi.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;const cd=toDate(r.createdAt||r.date);if(cd&&cd>=curr.start&&cd<curr.end){d.fire.inspections++;if(r.hasFailures)d.fire.failures++}});
    // GAS
    d.gas={total:0,overdue:0,dueSoon:0,addedCurr:0,addedPrev:0};
    const s60=new Date(nowDate.getTime()+60*864e5);
    snaps.gas.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;d.gas.total++;
        const cd=toDate(r.createdAt||r.dateAdded||r.dateCreated);
        if(cd&&cd>=curr.start&&cd<curr.end)d.gas.addedCurr++;if(cd&&cd>=prev.start&&cd<prev.end)d.gas.addedPrev++;
        if(r.nextInspectionDue){const dd=new Date(r.nextInspectionDue);if(dd<nowDate)d.gas.overdue++;else if(dd<s60)d.gas.dueSoon++}
    });
    // VEHICLES
    d.veh={total:0,motOverdue:0,insOverdue:0,svcOverdue:0,addedCurr:0,addedPrev:0,names:[],inspCurr:0,inspPrev:0};
    snaps.veh.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;d.veh.total++;
        d.veh.names.push(r.registration||r.vehicleName||r.name||r.description||'Vehicle');
        const cd=toDate(r.createdAt||r.dateAdded||r.dateCreated);
        if(cd&&cd>=curr.start&&cd<curr.end)d.veh.addedCurr++;if(cd&&cd>=prev.start&&cd<prev.end)d.veh.addedPrev++;
        if(r.motExpiry&&new Date(r.motExpiry)<nowDate)d.veh.motOverdue++;
        if(r.insuranceExpiry&&new Date(r.insuranceExpiry)<nowDate)d.veh.insOverdue++;
        if(r.nextServiceDue&&new Date(r.nextServiceDue)<nowDate)d.veh.svcOverdue++;
    });
    snaps.vi.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;const cd=toDate(r.createdAt||r.date);if(cd&&cd>=curr.start&&cd<curr.end)d.veh.inspCurr++;if(cd&&cd>=prev.start&&cd<prev.end)d.veh.inspPrev++});
    // ACTIONS
    d.act={curr:{raised:0,closed:0},prev:{raised:0,closed:0},overdue:0,open:0};
    snaps.act.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;
        const cd=toDate(r.createdAt||r.dateSubmitted||r.dateCreated);const done=isDone(r.status);
        if(!done){d.act.open++;if(r.targetDate&&new Date(r.targetDate)<nowDate)d.act.overdue++}
        if(cd&&cd>=curr.start&&cd<curr.end){d.act.curr.raised++;if(done)d.act.curr.closed++}
        if(cd&&cd>=prev.start&&cd<prev.end){d.act.prev.raised++;if(done)d.act.prev.closed++}
    });
    // COSHH
    d.coshh={total:0,overdue:0};
    snaps.coshh.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;d.coshh.total++;const rd=r.reviewDate||r.nextReview;if(rd&&new Date(rd)<nowDate)d.coshh.overdue++});
    // STAFF
    d.staff={count:0,trainingItems:snaps.tbtCount||0,acksCurr:0,acksPrev:0};
    const empParkMap={};
    snaps.emp.forEach(doc=>{const r=doc.data();if(!r.firstName||!r.lastName)return;
        if(matchPark(r,park)){d.staff.count++;empParkMap[doc.id]=true}
    });
    snaps.acks.forEach(doc=>{const r=doc.data();if(!r.confirmed)return;
        if(!empParkMap[r.employeeId])return;
        const ad=toDate(r.date||r.completedAt||r.acknowledgedAt);
        if(ad&&ad>=curr.start&&ad<curr.end)d.staff.acksCurr++;
        if(ad&&ad>=prev.start&&ad<prev.end)d.staff.acksPrev++;
    });
    // SAFECARE
    d.sc={curr:0,open:0};
    snaps.sc.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;const cd=toDate(r.createdAt||r.date);if(cd&&cd>=curr.start&&cd<curr.end)d.sc.curr++;if(!isDone(r.status)&&r.currentStage!==5)d.sc.open++});
    // CONTRACTORS
    d.contr={total:0,activeCurr:0};
    snaps.contr.forEach(doc=>{const r=doc.data();if(!matchPark(r,park))return;d.contr.total++;const cd=toDate(r.createdAt||r.dateAdded);if(cd&&cd>=curr.start&&cd<curr.end)d.contr.activeCurr++});
    return d;
}

async function loadAllSnapshots(msg){
    const snaps={};
    msg.textContent='Loading maintenance...';snaps.maint=await db.collection('maintenanceRecords').get();
    msg.textContent='Loading incidents...';snaps.inc=await db.collection('incidents').get();
    msg.textContent='Loading accommodation config...';try{snaps.acCfg=await db.collection('accommodation_config').get()}catch(e){snaps.acCfg={forEach:()=>{}}}

async function generateReport(){
    const btn=document.getElementById('btnGenerate'),msg=document.getElementById('statusMsg');
    btn.disabled=true;msg.textContent='Connecting to Firebase...';
    if(!initFB()){msg.textContent='Firebase connection failed.';btn.disabled=false;return}
    try{await firebase.auth().signInAnonymously()}catch(e){}

    const park=document.getElementById('selPark').value;
    const[yr,mn]=document.getElementById('selMonth').value.split('-').map(Number);
    const execNotes=document.getElementById('execNotes').value;
    const recsNotes=document.getElementById('recsNotes').value;
    const curr=MR(yr,mn-1),prev=MR(mn===1?yr-1:yr,mn===1?11:mn-2);
    const m3=MR(mn<=2?yr-1:yr,mn<=2?mn+9:mn-4),m2=MR(mn===1?yr-1:yr,mn===1?11:mn-2);
    const nowDate=new Date();

    try{
    const snaps=await loadAllSnapshots(msg);

    if(park==='__DIRECTORS__'){
        document.title='SafeSystems.PRO — Directors Report';
        // Directors report — all parks
        const parks=['Ben Nevis Holiday Park','Oban Holiday Park','Tyndrum Holiday Park'];
        const allData={};
        parks.forEach(p=>{msg.textContent='Processing '+p.split(' Holiday')[0]+'...';allData[p]=collectData(p,snaps,curr,prev,m3,m2,nowDate)});
        msg.textContent='Building directors report...';
        renderDirectorsReport(parks,allData,curr,prev,execNotes,recsNotes);
    }else{
        const pn=park.split(' Holiday')[0];
        const d=collectData(park,snaps,curr,prev,m3,m2,nowDate);
        msg.textContent='Building report...';
        renderReport(park,pn,curr,prev,d,execNotes,recsNotes);
    }
    msg.textContent='Report generated successfully.';
    btn.disabled=false;
    document.getElementById('btnPrint').style.display='inline-block';

    }catch(e){msg.textContent='Error: '+e.message;console.error(e);btn.disabled=false}
}

function renderReport(park,pn,curr,prev,d,execNotes,recsNotes){
    const cn=MN(curr.start),pv=MN(prev.start),ps=SM(prev.start);
    const mp=pct(d.maint.curr.done,d.maint.curr.total),mpp=pct(d.maint.prev.done,d.maint.prev.total);
    const mt3=pct(d.maint.m3.done,d.maint.m3.total),mt2=pct(d.maint.m2.done,d.maint.m2.total);
    const tT=d.staff.count*d.staff.trainingItems;
    const tp=tT>0?Math.min(pct(d.staff.acksCurr,tT),100):0,tpp=tT>0?Math.min(pct(d.staff.acksPrev,tT),100):0;
    const htE=d.ht.expected*d.ht.daysInMonth,htP=htE>0?pct(d.ht.curr.records,htE):0;
    // Play park expected: 1 play park per park × days in month
    const ppE=d.ht.daysInMonth,ppP=ppE>0?Math.min(pct(d.pp.curr.total,ppE),100):0;
    // Weighted compliance score
    const compScores=[];
    if(d.ht.expected>0)compScores.push({s:htP,w:20,n:'Hot tubs'});
    if(ppE>0)compScores.push({s:ppP,w:15,n:'Play parks'});
    if(d.accom.expected>0)compScores.push({s:pct(d.accom.curr.units.size,d.accom.expected),w:15,n:'Accommodation'});
    if(d.maint.curr.total>0)compScores.push({s:mp,w:10,n:'Maintenance'});
    if(d.act.open+d.act.curr.closed>0)compScores.push({s:d.act.overdue===0?100:pct(d.act.open-d.act.overdue,d.act.open)*100>100?100:pct(Math.max(0,(d.act.curr.raised+d.act.open)-d.act.overdue),(d.act.curr.raised+d.act.open)),w:10,n:'Actions'});
    if(d.inc.curr.total>0)compScores.push({s:pct(d.inc.curr.closed,d.inc.curr.total),w:10,n:'Incidents'});
    if(d.gas.total>0)compScores.push({s:d.gas.overdue===0?100:pct(d.gas.total-d.gas.overdue,d.gas.total),w:10,n:'Gas'});
    if(d.fire.extinguishers>0)compScores.push({s:d.fire.overdue===0?100:pct(d.fire.extinguishers-d.fire.overdue,d.fire.extinguishers),w:5,n:'Fire'});
    if(d.veh.total>0)compScores.push({s:(d.veh.motOverdue+d.veh.insOverdue)===0?100:pct(d.veh.total-(d.veh.motOverdue+d.veh.insOverdue),d.veh.total),w:5,n:'Vehicles'});
    if(d.coshh.total>0)compScores.push({s:d.coshh.overdue===0?100:pct(d.coshh.total-d.coshh.overdue,d.coshh.total),w:5,n:'COSHH'});
    if(tT>0)compScores.push({s:tp,w:5,n:'Continual Training'});
    const compTotalW=compScores.reduce((a,c)=>a+c.w,0);
    const cp=compTotalW>0?Math.round(compScores.reduce((a,c)=>a+c.s*(c.w/compTotalW),0)):0;
    // Previous month compliance (simplified — use maintenance + incidents as proxy)
    const cpp=mpp>0?mpp:0;
    const compGaps=['Gas','Fire','COSHH','Vehicles','Contractors','Staff'].filter(n=>{
        if(n==='Gas')return d.gas.total===0;if(n==='Fire')return d.fire.extinguishers===0;
        if(n==='COSHH')return d.coshh.total===0;if(n==='Vehicles')return d.veh.total===0;
        if(n==='Contractors')return d.contr.total===0;if(n==='Staff')return d.staff.count===0;return false;
    });
    const dM=DP(mp,mpp),dC=DP(cp,cpp),dT=DP(tp,tpp);
    const exec=buildExecSummary(pn,cn,pv,d);
    const nM=narrate('maint',pn,cn,pv,d),nI=narrate('inc',pn,cn,pv,d),nH=narrate('ht',pn,cn,pv,d),nA=narrate('accom',pn,cn,pv,d),nP=narrate('pp',pn,cn,pv,d);

        if(deltaObj)h+='<div class="m-delta '+deltaObj.cls+'">'+deltaObj.arrow+' '+deltaObj.val+'</div>';

        ${met('Acknowledgements',d.staff.acksCurr,null,D(d.staff.acksCurr,d.staff.acksPrev))}
        ${met('Completion',tp+'%','Target: '+tT)}
    </div>
    ${d.staff.count===0?gap(pn,'has zero staff records in SafeTeam.'):''}</div>

    <!-- SAFECARE -->
    <div class="rpt-section"><h3>safe<span>care</span>.pro max — Guest Welfare ${d.sc.open>0?'<span class="badge badge-warn">'+d.sc.open+' Open</span>':'<span class="badge badge-ok">Clear</span>'}</h3>
    <div class="metrics">
        ${met('Cases This Month',d.sc.curr)}
        ${met('Open',d.sc.open,null,null,d.sc.open>0?'color:var(--amber)':'')}
    </div></div>

    <!-- DOCSAFE -->
    <div class="rpt-section"><h3>doc<span>safe</span>.pro — Documents <span class="badge badge-info">Pending</span></h3>
    <div class="narrative">Document expiry tracking will be added once DocSafe collection details are confirmed.</div></div>

    <!-- DATA GAPS TABLE -->
    <div class="rpt-section"><h3>${pn} — Module Activity & <span>Data Gaps</span></h3>
    <table class="dtable">
        <tr><th>Module</th><th>${pn} Records</th><th>Status</th></tr>
        <tr><td>safemaint.pro</td><td>${d.maint.curr.total} jobs</td><td>${d.maint.curr.total>0?'<span style="color:var(--green)">Active — '+mp+'%</span>':'<span style="color:var(--red)">'+pn+' added zero</span>'}</td></tr>
        <tr><td>safereport.pro</td><td>${d.inc.curr.total}</td><td>${d.inc.curr.total>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--dim)">'+pn+' reported zero</span>'}</td></tr>
        <tr><td>safewater.pro (HT)</td><td>${d.ht.curr.records} / ${htE}</td><td>${d.ht.curr.records>0?htP>=90?'<span style="color:var(--green)">'+htP+'%</span>':'<span style="color:var(--amber)">'+htP+'%</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>cozzZstays.pro</td><td>${d.accom.curr.units.size} / ${d.accom.expected} units</td><td>${d.accom.expected>0?(pct(d.accom.curr.units.size,d.accom.expected)>=90?'<span style="color:var(--green)">'+pct(d.accom.curr.units.size,d.accom.expected)+'%</span>':'<span style="color:var(--amber)">'+pct(d.accom.curr.units.size,d.accom.expected)+'%</span>'):'<span style="color:var(--red)">No config</span>'}</td></tr>
        <tr><td>safepark.pro</td><td>${d.pp.curr.total}</td><td>${d.pp.curr.total>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safefire.pro+</td><td>${d.fire.extinguishers} ext / ${d.fire.firePoints} pts</td><td>${d.fire.extinguishers>0?d.fire.overdue>0?'<span style="color:var(--red)">'+d.fire.overdue+' overdue</span>':'<span style="color:var(--green)">Active</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safegas.pro</td><td>${d.gas.total} (${d.gas.addedCurr} new)</td><td>${d.gas.total>0?d.gas.overdue>0?'<span style="color:var(--red)">'+d.gas.overdue+' overdue</span>':'<span style="color:var(--green)">Compliant</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safevehicle.pro+</td><td>${d.veh.total} (${d.veh.addedCurr} new)</td><td>${d.veh.total>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safeaction.pro</td><td>${d.act.curr.raised} / ${d.act.curr.closed}</td><td>${d.act.overdue>0?'<span style="color:var(--red)">'+d.act.overdue+' overdue</span>':'<span style="color:var(--green)">On Track</span>'}</td></tr>
        <tr><td>safechem.pro+</td><td>${d.coshh.total}</td><td>${d.coshh.total>0?d.coshh.overdue>0?'<span style="color:var(--red)">'+d.coshh.overdue+' overdue</span>':'<span style="color:var(--green)">Compliant</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safespray.pro</td><td>0</td><td><span style="color:var(--red)">Not in use</span></td></tr>
        <tr><td>safecontractor.pro+</td><td>${d.contr.total}</td><td>${d.contr.total>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safeteams.pro+</td><td>${d.staff.count}</td><td>${d.staff.count>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--red)">'+pn+' zero</span>'}</td></tr>
        <tr><td>safelearn.pro+ (Continual Training)</td><td>${d.staff.acksCurr} acks</td><td>${d.staff.acksCurr>0?'<span style="color:var(--green)">Active</span>':'<span style="color:var(--amber)">Zero</span>'}</td></tr>
        <tr><td>safecare.pro max</td><td>${d.sc.curr}</td><td>${d.sc.open>0?'<span style="color:var(--amber)">'+d.sc.open+' open</span>':'<span style="color:var(--green)">Clear</span>'}</td></tr>
        <tr><td>docsafe.pro</td><td>—</td><td><span style="color:var(--blue)">Pending</span></td></tr>
    </table></div>

    <!-- RECOMMENDATIONS -->
    <div style="margin-bottom:20px">
    <table class="dtable" style="border:2px solid var(--green);border-radius:12px;overflow:hidden">
        <thead style="background:#ecfdf3"><tr><th colspan="3" style="text-align:left;color:var(--green);font-size:16px;padding:14px 20px;font-weight:700">Omnibosh Recommendations — Prioritised Actions</th></tr>
        <tr style="background:#f0fdf4"><th style="width:30px;padding:8px 12px">#</th><th style="width:70px;padding:8px 12px">Priority</th><th style="padding:8px 12px">Recommendation</th></tr></thead>
        <tbody>
        ${recs.map((r,i)=>'<tr style="break-inside:avoid;page-break-inside:avoid"><td style="padding:8px 12px;font-weight:700;color:var(--dim)">'+(i+1)+'</td><td style="padding:8px 12px"><span class="badge badge-'+(r.p==='critical'?'alert':r.p==='high'?'warn':'ok')+'" style="font-size:11px">'+r.p.toUpperCase()+'</span></td><td style="padding:8px 12px;font-size:13px;line-height:1.5">'+r.t+'</td></tr>').join('')}
        </tbody>
    </table>
    ${recsNotes?'<div style="padding:16px 20px;background:#ecfdf3;border:2px solid var(--green);border-top:none;border-radius:0 0 12px 12px;margin-top:-2px"><strong>Omnibosh additional notes:</strong>'+fmtNotes(recsNotes)+'</div>':''}
    </div>

    <div style="text-align:center;padding:16px;font-size:12px;color:var(--dim)">
        SafeSystems.PRO — Monthly Park Report — Generated ${new Date().toLocaleDateString('en-GB')} — Omnibosh Safety Solutions Ltd<br>
        Confidential — prepared for the management team of ${park}.
    </div>`;

    document.getElementById('reportOutput').innerHTML=h;
    document.getElementById('reportOutput').style.display='block';
}

// =============================================
// DIRECTORS REPORT RENDERER
// =============================================
function renderDirectorsReport(parks,allData,curr,prev,execNotes,recsNotes){
    const cn=MN(curr.start),pv=MN(prev.start),ps=SM(prev.start);
    const dim=Math.round((curr.end-curr.start)/864e5);

    // Calculate scores for each park
    function parkScore(d){
        const mp=pct(d.maint.curr.done,d.maint.curr.total);
        const htE=d.ht.expected*d.ht.daysInMonth,htP=htE>0?pct(d.ht.curr.records,htE):0;
        const ppP=dim>0?Math.min(pct(d.pp.curr.total,dim),100):0;
        const acP=d.accom.expected>0?pct(d.accom.curr.units.size,d.accom.expected):0;
        const tT=d.staff.count*d.staff.trainingItems;
        const tp=tT>0?Math.min(pct(d.staff.acksCurr,tT),100):0;
        const scores=[];
        if(d.ht.expected>0)scores.push({s:htP,w:20});
        if(dim>0)scores.push({s:ppP,w:15});
        if(d.accom.expected>0)scores.push({s:acP,w:15});
        if(d.maint.curr.total>0)scores.push({s:mp,w:10});
        if(d.act.open+d.act.curr.closed>0)scores.push({s:d.act.overdue===0?100:pct(Math.max(0,(d.act.curr.raised+d.act.open)-d.act.overdue),(d.act.curr.raised+d.act.open)),w:10});
        if(d.inc.curr.total>0)scores.push({s:pct(d.inc.curr.closed,d.inc.curr.total),w:10});
        if(d.gas.total>0)scores.push({s:d.gas.overdue===0?100:pct(d.gas.total-d.gas.overdue,d.gas.total),w:10});
        if(d.fire.extinguishers>0)scores.push({s:d.fire.overdue===0?100:pct(d.fire.extinguishers-d.fire.overdue,d.fire.extinguishers),w:5});
        if(d.veh.total>0)scores.push({s:(d.veh.motOverdue+d.veh.insOverdue)===0?100:pct(d.veh.total-(d.veh.motOverdue+d.veh.insOverdue),d.veh.total),w:5});
        if(d.coshh.total>0)scores.push({s:d.coshh.overdue===0?100:pct(d.coshh.total-d.coshh.overdue,d.coshh.total),w:5});
        if(tT>0)scores.push({s:tp,w:5});
        const tw=scores.reduce((a,c)=>a+c.w,0);
        return tw>0?Math.round(scores.reduce((a,c)=>a+c.s*(c.w/tw),0)):0;
    }

    const scores={};const pNames={};
    parks.forEach(p=>{const pn=p.split(' Holiday')[0];pNames[p]=pn;scores[p]=parkScore(allData[p])});

    // Park of the month
    const best=parks.reduce((a,b)=>scores[a]>=scores[b]?a:b);

    // Cross-park exec summary
    let execLines=[];
    execLines.push('This directors report consolidates safety compliance data across all three Highland Holidays parks for '+cn+', compared against '+pv+'.');
    execLines.push('');
    parks.forEach(p=>{const d=allData[p],pn=pNames[p];
        const mp=pct(d.maint.curr.done,d.maint.curr.total);
        const htE=d.ht.expected*d.ht.daysInMonth,htP=htE>0?pct(d.ht.curr.records,htE):0;
        const ppP=dim>0?pct(d.pp.curr.total,dim):0;
        const acP=d.accom.expected>0?pct(d.accom.curr.units.size,d.accom.expected):0;
        execLines.push('<strong>'+pn+'</strong> (Score: '+scores[p]+'%) — Maintenance '+mp+'%, Hot tubs '+htP+'%, Play parks '+ppP+'%, Accommodation '+acP+'%, Incidents: '+d.inc.curr.total+' ('+d.inc.curr.riddor+' RIDDOR), Actions overdue: '+d.act.overdue+'.');
    });
    execLines.push('');
    execLines.push('<strong>Park of the month: '+pNames[best]+'</strong> — highest weighted compliance score at '+scores[best]+'%.');

    // All recs across all parks
    const allRecs=[];
    parks.forEach(p=>{const recs=buildRecs(pNames[p],allData[p]);recs.forEach(r=>{r.park=pNames[p];allRecs.push(r)})});
    const recOrder={critical:1,high:2,medium:3};
    allRecs.sort((a,b)=>(recOrder[a.p]||9)-(recOrder[b.p]||9));

    function sc(v){return v>=70?'color:var(--green)':v>=40?'color:var(--amber)':'color:var(--red)'}

    // Omnibosh logo base64 (same as park report header)
    const omniLogo=document.querySelector('.rpt-header img')?.src||'';

    let h=`
    <div class="rpt-header">
        <img src="${LOGO_OMNI}" alt="Omnibosh" style="height:55px;border-radius:8px">
        <div class="titles"><h1>Safe<span>Systems</span>.PRO — Directors Report</h1><div class="sub">Consolidated Safety & Compliance — Prepared by Omnibosh Safety Solutions</div></div>
        <div class="meta"><div class="park-name" style="color:var(--orange)">Highland Holidays</div><div class="period">${cn}</div><div class="period" style="font-size:11px;margin-top:2px">Compared to ${pv}</div></div>
        <img src="${LOGO_HH}" alt="Highland Holidays" style="height:55px;border-radius:8px">
    </div>

    <div class="rpt-exec"><h3>Executive Summary</h3><div>${execLines.join('<br>')}</div></div>

    ${execNotes?`<div style="padding:20px 28px;background:#fff;border:2px solid var(--orange);border-radius:12px;margin-bottom:20px;break-inside:auto;page-break-inside:auto"><h3 style="font-size:16px;color:var(--orange);margin-bottom:12px;font-weight:700">Omnibosh Safety Partner Commentary</h3>${fmtNotes(execNotes)}</div>`:''}

    <!-- OVERALL SCORES -->
    <div class="reels" style="grid-template-columns:repeat(${parks.length},1fr)">
        ${parks.map(p=>`<div class="reel"><div class="reel-label">${pNames[p]}</div><div class="reel-value" style="${sc(scores[p])}">${scores[p]}<span style="font-size:20px;color:var(--dim)">%</span></div><div class="reel-bar"><div class="reel-fill" style="width:${scores[p]}%;background:${scores[p]>=70?'var(--green)':scores[p]>=40?'var(--amber)':'var(--red)'}"></div></div><div class="reel-sub">Overall Safety Score${p===best?' · <span style="color:var(--green)">★ Park of the Month</span>':''}</div></div>`).join('')}
    </div>

    <!-- COMPARISON TABLE -->
    <div class="rpt-section" style="break-inside:auto;page-break-inside:auto"><h3>Cross-Park Comparison — <span>${cn}</span></h3>
    <table class="dtable">
        <tr><th>Module</th>${parks.map(p=>'<th>'+pNames[p]+'</th>').join('')}</tr>
        <tr><td><strong>Overall Score</strong></td>${parks.map(p=>'<td style="font-weight:700;'+sc(scores[p])+'">'+scores[p]+'%</td>').join('')}</tr>
        <tr><td>Maintenance Completion</td>${parks.map(p=>{const d=allData[p];const v=pct(d.maint.curr.done,d.maint.curr.total);return'<td>'+v+'% <span style="color:var(--dim)">('+d.maint.curr.done+'/'+d.maint.curr.total+')</span></td>'}).join('')}</tr>
        <tr><td>Hot Tub Compliance</td>${parks.map(p=>{const d=allData[p];const e=d.ht.expected*d.ht.daysInMonth;const v=e>0?pct(d.ht.curr.records,e):0;return'<td style="'+(v<90?'color:var(--red)':'')+'">'+v+'% <span style="color:var(--dim)">('+d.ht.curr.records+'/'+e+')</span></td>'}).join('')}</tr>
        <tr><td>Play Park Inspections</td>${parks.map(p=>{const d=allData[p];const v=dim>0?pct(d.pp.curr.total,dim):0;return'<td style="'+(v<90?'color:var(--red)':'')+'">'+v+'% <span style="color:var(--dim)">('+d.pp.curr.total+'/'+dim+')</span></td>'}).join('')}</tr>
        <tr><td>Accommodation Inspections</td>${parks.map(p=>{const d=allData[p];const v=d.accom.expected>0?pct(d.accom.curr.units.size,d.accom.expected):0;return'<td style="'+(v<90?'color:var(--red)':'')+'">'+v+'% <span style="color:var(--dim)">('+d.accom.curr.units.size+'/'+d.accom.expected+')</span></td>'}).join('')}</tr>
        <tr><td>Incidents Reported</td>${parks.map(p=>{const d=allData[p];return'<td>'+d.inc.curr.total+(d.inc.curr.riddor>0?' <span style="color:var(--red)">('+d.inc.curr.riddor+' RIDDOR)</span>':'')+'</td>'}).join('')}</tr>
        <tr><td>Actions Overdue</td>${parks.map(p=>{const d=allData[p];return'<td style="'+(d.act.overdue>0?'color:var(--red);font-weight:700':'')+'">'+d.act.overdue+' <span style="color:var(--dim)">('+d.act.open+' open)</span></td>'}).join('')}</tr>
        <tr><td>Gas Appliances</td>${parks.map(p=>'<td>'+allData[p].gas.total+(allData[p].gas.overdue>0?' <span style="color:var(--red)">('+allData[p].gas.overdue+' overdue)</span>':'')+'</td>').join('')}</tr>
        <tr><td>Fire Extinguishers</td>${parks.map(p=>'<td>'+allData[p].fire.extinguishers+(allData[p].fire.overdue>0?' <span style="color:var(--red)">('+allData[p].fire.overdue+' overdue)</span>':'')+'</td>').join('')}</tr>
        <tr><td>Vehicles</td>${parks.map(p=>'<td>'+allData[p].veh.total+(allData[p].veh.motOverdue+allData[p].veh.insOverdue>0?' <span style="color:var(--red)">('+( allData[p].veh.motOverdue+allData[p].veh.insOverdue)+' overdue)</span>':'')+'</td>').join('')}</tr>
        <tr><td>COSHH Substances</td>${parks.map(p=>'<td>'+allData[p].coshh.total+(allData[p].coshh.overdue>0?' <span style="color:var(--red)">('+allData[p].coshh.overdue+' overdue)</span>':'')+'</td>').join('')}</tr>
        <tr><td>Staff</td>${parks.map(p=>'<td>'+allData[p].staff.count+'</td>').join('')}</tr>
        <tr><td>Continual Training</td>${parks.map(p=>{const d=allData[p];const tT=d.staff.count*d.staff.trainingItems;const tp=tT>0?Math.min(pct(d.staff.acksCurr,tT),100):0;return'<td>'+tp+'% <span style="color:var(--dim)">('+d.staff.acksCurr+' acks)</span></td>'}).join('')}</tr>
    </table></div>

    <!-- PER-PARK SUMMARIES -->
    ${parks.map(p=>{const d=allData[p],pn=pNames[p];
        const mp=pct(d.maint.curr.done,d.maint.curr.total);
        const htE=d.ht.expected*d.ht.daysInMonth,htP=htE>0?pct(d.ht.curr.records,htE):0;
        const ppP=dim>0?pct(d.pp.curr.total,dim):0;
        const acP=d.accom.expected>0?pct(d.accom.curr.units.size,d.accom.expected):0;
        const exec=buildExecSummary(pn,cn,pv,d);
        return`<div class="rpt-section" style="break-inside:auto;page-break-inside:auto"><h3>${pn} — <span>Summary</span> ${SB(scores[p],70,40)}${p===best?' <span class="badge badge-ok">★ Park of the Month</span>':''}</h3>
        <div class="narrative">${exec}</div></div>`;
    }).join('')}

    <!-- CONSOLIDATED RECOMMENDATIONS — GROUPED BY PARK -->
    ${(()=>{
        // Group recs by park
        const byPark={};
        parks.forEach(p=>byPark[pNames[p]]=[]);
        allRecs.forEach(r=>{if(byPark[r.park])byPark[r.park].push(r)});
        let num=0;
        return parks.map(p=>{
            const pn=pNames[p];
            const parkRecs=byPark[pn];
            if(parkRecs.length===0)return'';
            const borderCol=scores[p]>=70?'var(--green)':scores[p]>=40?'var(--amber)':'var(--red)';
            return`<div style="margin-bottom:16px">
            <table class="dtable" style="border:2px solid ${borderCol};border-radius:12px;overflow:hidden">
                <thead><tr style="background:${scores[p]>=70?'#ecfdf3':scores[p]>=40?'#fef6ee':'#fef3f2'}"><th colspan="3" style="text-align:left;font-size:15px;padding:14px 20px;font-weight:700;color:var(--text)">${pn} — Recommendations <span style="font-weight:400;color:var(--dim)">(${parkRecs.length} items)</span> ${SB(scores[p],70,40)}</th></tr>
                <tr style="background:#fafbfc"><th style="width:30px;padding:6px 12px">#</th><th style="width:70px;padding:6px 12px">Priority</th><th style="padding:6px 12px">Recommendation</th></tr></thead>
                <tbody>
                ${parkRecs.map(r=>{num++;return`<tr style="break-inside:avoid;page-break-inside:avoid"><td style="padding:8px 12px;font-weight:700;color:var(--dim)">${num}</td><td style="padding:8px 12px"><span class="badge badge-${r.p==='critical'?'alert':r.p==='high'?'warn':'ok'}" style="font-size:11px">${r.p.toUpperCase()}</span></td><td style="padding:8px 12px;font-size:13px;line-height:1.5">${r.t}</td></tr>`}).join('')}
                </tbody>
            </table></div>`;
        }).join('');
    })()}
    ${recsNotes?'<div style="padding:16px 20px;background:#ecfdf3;border:2px solid var(--green);border-radius:12px;margin-bottom:16px"><strong>Omnibosh additional notes:</strong>'+fmtNotes(recsNotes)+'</div>':''}
    

    <!-- FOOTER -->
    <div style="text-align:center;padding:16px;color:var(--dim);font-size:12px;border-top:1px solid var(--border);margin-top:20px">
        SafeSystems.PRO — Directors Report — Generated ${new Date().toLocaleDateString('en-GB')} — Omnibosh Safety Solutions Ltd<br>
        Confidential — prepared for the directors of Highland Holidays
    </div>`;

    document.getElementById('reportOutput').innerHTML=h;
    document.getElementById('reportOutput').style.display='block';
}
</script>
