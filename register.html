<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafeSystems.PRO — Register</title>
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration (same as index.html) -->
    <script src="firebase-config.js"></script>

    <!-- Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #CC5500;
            --dark-orange: #b34a00;
            --light-orange: #e06d1a;
            --orange-glow: rgba(204, 85, 0, 0.3);
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #4a4a4a;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px),
                repeating-linear-gradient(-45deg, transparent, transparent 3px, rgba(255,255,255,0.04) 3px, rgba(255,255,255,0.04) 6px),
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 45%),
                linear-gradient(145deg, #555 0%, #4a4a4a 50%, #3f3f3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .safepark-header {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            line-height: 1;
            margin-bottom: 20px;
        }

        .safepark-header .safe-part {
            font-family: 'Orbitron', monospace;
            font-size: 2.4rem;
            color: #C0C0C0;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            line-height: 1;
            transform: scaleY(0.85);
        }

        .safepark-header .systems-part {
            font-family: 'Orbitron', monospace;
            font-size: 2.4rem;
            color: var(--primary-orange);
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6), 0 0 20px rgba(204,85,0,0.3);
            line-height: 1;
            transform: scaleY(0.85);
        }

        .safepark-header .pro-part {
            font-family: 'Orbitron', monospace;
            font-size: 2.4rem;
            color: #C0C0C0;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            line-height: 1;
            transform: scaleY(0.85);
        }

        /* ===== LOGIN CARD ===== */
        .login-form-container {
            background: linear-gradient(165deg, #2a2a2a 0%, #1a1a1a 40%, #0e0e0e 100%);
            border: none;
            border-top: 2px solid #444;
            border-bottom: 4px solid #000;
            border-left: 5px solid var(--primary-orange);
            border-right: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.9),
                0 12px 25px rgba(0,0,0,0.7),
                0 6px 12px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 -1px 0 rgba(0,0,0,0.6);
            max-width: 600px;
            width: 90%;
        }

        .login-subtitle {
            font-size: 1.1rem;
            color: #999;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-orange);
            font-weight: 300;
            font-size: 0.95rem;
        }

        .login-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            background: linear-gradient(145deg, #0d0d0d, #161616);
            border: 1px solid #333;
            border-radius: 10px;
            color: var(--white);
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.5), 0 0 15px rgba(204,85,0,0.3);
        }

        .login-input::placeholder {
            color: #666;
            font-weight: normal;
        }

        /* ===== BUTTONS ===== */
        .login-btn {
            background: linear-gradient(165deg, #ff9248 0%, #CC5500 40%, #b34a00 100%);
            color: #fff;
            padding: 16px 32px;
            border: none;
            border-top: 2px solid #ffb070;
            border-bottom: 3px solid #7a3000;
            border-left: 1px solid #e56820;
            border-right: 1px solid #a54510;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 6px 12px rgba(204,85,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 60%;
            margin: 40px auto 0;
            display: block;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .login-btn:hover {
            background: linear-gradient(165deg, #ffb070 0%, #ff9248 40%, #CC5500 100%);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 8px 18px rgba(204,85,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .login-btn:active {
            transform: translateY(2px);
            border-top: 1px solid #e56820;
            border-bottom: 1px solid #993800;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6), inset 0 3px 6px rgba(0,0,0,0.3);
        }

        .register-btn {
            background: linear-gradient(165deg, #2d8a4e 0%, #1a6b35 40%, #145a2b 100%);
            border-top-color: #4ebb76;
            border-bottom-color: #0d3d1c;
            border-left-color: #27a050;
            border-right-color: #1a6b35;
        }

        .register-btn:hover {
            background: linear-gradient(165deg, #38a85e 0%, #2d8a4e 40%, #1a6b35 100%);
        }

        .register-link-btn {
            background: linear-gradient(165deg, #2a2a2a 0%, #1a1a1a 40%, #0e0e0e 100%);
            color: #CC5500;
            padding: 12px 24px;
            border: 1px solid #444;
            border-top: 2px solid #555;
            border-bottom: 3px solid #000;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            width: 100%;
            letter-spacing: 0.5px;
        }

        .register-link-btn:hover {
            background: linear-gradient(165deg, #353535 0%, #252525 40%, #1a1a1a 100%);
            color: #ff9248;
            border-color: #CC5500;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 15px rgba(204,85,0,0.2);
        }

        .back-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            margin-top: 12px;
            font-size: 0.9rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn:hover {
            color: #CC5500;
        }

        /* ===== ERROR MESSAGE ===== */
        .login-error {
            color: #ef5555;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 10px rgba(239,68,68,0.3);
        }

        .login-error.show {
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .login-form-container { padding: 30px 25px; }
            .safepark-header .safe-part,
            .safepark-header .systems-part,
            .safepark-header .pro-part { font-size: 1.7rem !important; }
            .login-btn { width: 80%; }
        }

        @media (max-width: 480px) {
            .safepark-header .safe-part,
            .safepark-header .systems-part,
            .safepark-header .pro-part { font-size: 1.4rem !important; }
            .login-btn { width: 90%; }
        }

        @media (max-width: 360px) {
            .safepark-header .safe-part,
            .safepark-header .systems-part,
            .safepark-header .pro-part { font-size: 1.2rem !important; }
        }
    </style>
</head>
<body>

    <div class="login-form-container">
        <h1 class="safepark-header">
            <span class="safe-part">safe</span><span class="systems-part">systems</span><span class="pro-part">.pro</span>
        </h1>
        <div class="login-subtitle">Safety & Compliance Platform</div>
        
        <!-- LOGIN FORM (for returning users) -->
        <div id="loginForm">
            <div class="form-group">
                <label for="accessCode">Enter Your Access Code</label>
                <input 
                    type="password" 
                    class="login-input" 
                    id="accessCode" 
                    placeholder="Your access code"
                    maxlength="20"
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="button" class="login-btn" onclick="handleLogin()">Enter .PRO</button>
            <div class="login-error" id="loginError">Code not recognised. Please check and try again.</div>
            
            <div style="margin-top: 15px;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;">
                    <div style="flex: 1; height: 1px; background: #444;"></div>
                    <span style="color: #777; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">or</span>
                    <div style="flex: 1; height: 1px; background: #444;"></div>
                </div>
                <button type="button" class="register-link-btn" onclick="showRegister()">Register — Free SafeWater Access</button>
            </div>
        </div>

        <!-- REGISTRATION FORM (hidden by default) -->
        <div id="registerForm" style="display: none;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 25px;">
                <div style="flex: 1; height: 1px; background: #444;"></div>
                <span style="color: #CC5500; font-size: 0.9rem; font-weight: 600; letter-spacing: 1px;">REGISTER</span>
                <div style="flex: 1; height: 1px; background: #444;"></div>
            </div>
            
            <div class="form-group">
                <label for="regParkName">Park Name</label>
                <input type="text" class="login-input" id="regParkName" placeholder="e.g. Lakeside Holiday Park" maxlength="60" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="regUserName">Your Name</label>
                <input type="text" class="login-input" id="regUserName" placeholder="e.g. John Smith" maxlength="40" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="regAccessCode">Choose Your Access Code</label>
                <input type="text" class="login-input" id="regAccessCode" placeholder="Min 6 characters" maxlength="20" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="regEmail">Contact Email</label>
                <input type="email" class="login-input" id="regEmail" placeholder="your@email.com" maxlength="60" autocomplete="off">
            </div>
            
            <button type="button" class="login-btn register-btn" onclick="registerNewPark()">Register & Enter</button>
            <button type="button" class="back-btn" onclick="showLogin()">← Back to Login</button>
            <div class="login-error" id="regError">Registration error</div>
        </div>
    </div>

    <script>
        // ===== FIREBASE INIT =====
        let db;
        
        async function initFirebase() {
            try {
                if (typeof firebase === 'undefined' || typeof firebaseConfig === 'undefined') {
                    console.error('❌ Firebase scripts not loaded');
                    return;
                }
                
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                
                // Sign in anonymously — required for Firestore access
                await firebase.auth().signInAnonymously();
                console.log('✅ Firebase ready');
            } catch (error) {
                console.error('❌ Firebase init error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', initFirebase);

        // ===== HARDCODED CODES TO BLOCK =====
        // These are reserved for HH — cannot be used as registration codes
        const reservedCodes = [
            'CQR365SPP25', 'BN2025HH', 'OB2025HH', 'TY2025HH', 'OF2025HH',
            'HR2025', 'HRBN2025', 'HROB2025', 'HRTY2025', 'HROF2025', 'HRALL2025',
            '365', 'demo2025', 'DEMO2025', 'STAFF2025', '1010', '1020', '1030', '9999'
        ];

        // ===== SHOW/HIDE FORMS =====
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('regParkName').focus();
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            // Clear registration fields
            document.getElementById('regParkName').value = '';
            document.getElementById('regUserName').value = '';
            document.getElementById('regAccessCode').value = '';
            document.getElementById('regEmail').value = '';
        }

        // ===== SHOW ERROR =====
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.opacity = '1';
            el.classList.add('show');
            setTimeout(() => {
                el.style.opacity = '0';
                el.classList.remove('show');
            }, 3000);
        }

        // ===== LOGIN (returning registered parks) =====
        async function handleLogin() {
            const code = document.getElementById('accessCode').value.trim();
            
            if (!code) return;

            // Block HH codes — they should use index.html
            if (reservedCodes.includes(code)) {
                showError('loginError', 'Code not recognised. Please check and try again.');
                document.getElementById('accessCode').value = '';
                return;
            }

            try {
                if (!db) {
                    showError('loginError', 'System loading. Please wait a moment and try again.');
                    return;
                }

                const snapshot = await db.collection('registered_parks')
                    .where('accessCode', '==', code)
                    .where('active', '==', true)
                    .get();

                if (!snapshot.empty) {
                    const parkData = snapshot.docs[0].data();
                    console.log('🔑 Park found:', parkData.parkName);
                    
                    // Store in session and proceed to dashboard
                    sessionStorage.setItem('currentAccessCode', code);
                    sessionStorage.setItem('currentUser', parkData.userName);
                    sessionStorage.setItem('currentPark', parkData.parkName);
                    sessionStorage.setItem('userAccessLevel', 'safewater_only');
                    
                    // TODO Step 2: redirect to dashboard
                    alert('Welcome back to ' + parkData.parkName + '!\n\nDashboard coming in Step 2.');
                } else {
                    showError('loginError', 'Code not recognised. Please check and try again.');
                    document.getElementById('accessCode').value = '';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                showError('loginError', 'Connection error. Please try again.');
            }
        }

        // ===== REGISTER NEW PARK =====
        async function registerNewPark() {
            const parkName = document.getElementById('regParkName').value.trim();
            const userName = document.getElementById('regUserName').value.trim();
            const newCode = document.getElementById('regAccessCode').value.trim();
            const email = document.getElementById('regEmail').value.trim();

            // Validation
            if (!parkName || !userName || !newCode || !email) {
                showError('regError', 'Please complete all fields.');
                return;
            }
            if (newCode.length < 6) {
                showError('regError', 'Access code must be at least 6 characters.');
                return;
            }
            if (reservedCodes.includes(newCode)) {
                showError('regError', 'That code is reserved. Please choose another.');
                return;
            }

            try {
                if (!db) {
                    showError('regError', 'System loading. Please wait a moment and try again.');
                    return;
                }

                // Check if code already taken
                const existing = await db.collection('registered_parks')
                    .where('accessCode', '==', newCode)
                    .get();
                    
                if (!existing.empty) {
                    showError('regError', 'That code is already taken. Please choose another.');
                    return;
                }

                // Save to Firebase
                await db.collection('registered_parks').add({
                    parkName: parkName,
                    userName: userName,
                    accessCode: newCode,
                    email: email,
                    level: 'safewater_only',
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
                    active: true
                });

                console.log('✅ Park registered:', parkName, 'code:', newCode);

                // Store in session
                sessionStorage.setItem('currentAccessCode', newCode);
                sessionStorage.setItem('currentUser', userName);
                sessionStorage.setItem('currentPark', parkName);
                sessionStorage.setItem('userAccessLevel', 'safewater_only');

                // TODO Step 2: redirect to dashboard
                alert('Welcome to SafeSystems.PRO, ' + userName + '!\n\nYour park "' + parkName + '" is registered.\nYour access code: ' + newCode + '\n\nDashboard coming in Step 2.');

            } catch (error) {
                console.error('❌ Registration error:', error);
                showError('regError', 'Registration failed. Please try again.');
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') {
                    handleLogin();
                } else {
                    registerNewPark();
                }
            }
        });
    </script>

</body>
</html>
