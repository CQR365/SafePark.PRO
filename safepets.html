<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SafePets.PRO - Dog Profile & Care Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<style>
:root{--primary:#E8654A;--primary-dark:#D4503A;--primary-light:#FDEAE6;--accent:#F5A623;--accent-light:#FFF4E0;--green:#2ECC71;--green-light:#E8F8EE;--blue:#4A90D9;--blue-light:#EBF3FC;--red:#E74C3C;--red-light:#FDECEB;--purple:#9B59B6;--purple-light:#F3E8F9;--bg:#F8F9FB;--white:#FFF;--border:#E8ECF1;--text:#2C3E50;--text-light:#7F8C9B;--text-lighter:#A8B5C2;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF5F3 0%,#F8F9FB 40%,#EBF3FC 100%);padding:20px}
.login-card{background:var(--white);border-radius:20px;padding:44px 36px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-logo{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 6px 20px rgba(232,101,74,.3)}
.login-brand{font-size:28px;font-weight:800;color:var(--text);margin-bottom:2px}
.login-brand span{color:var(--primary)}
.login-sub{color:var(--text-light);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:32px}
.login-field{text-align:left;margin-bottom:12px}
.login-field label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:6px}
.login-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:18px;text-align:center;letter-spacing:3px;font-weight:700;text-transform:uppercase;background:var(--bg);color:var(--text);transition:all .2s}
.login-input:focus{outline:none;border-color:var(--primary);background:var(--white)}
.login-input::placeholder{font-size:13px;letter-spacing:0;font-weight:400;text-transform:none;color:var(--text-lighter)}
.login-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;box-shadow:0 4px 15px rgba(232,101,74,.35)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,101,74,.45)}
.login-error{color:var(--red);font-size:12px;margin-top:8px}
.login-hint{color:var(--text-lighter);font-size:11px;margin-top:20px;line-height:1.6}

/* HEADER */
.header{background:var(--white);padding:14px 20px;border-bottom:3px solid var(--primary);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header-brand{font-size:20px;font-weight:800;color:var(--text)}
.header-brand span{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-light);background:var(--bg);padding:4px 10px;border-radius:20px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.status-dot.connected{background:var(--green);animation:none}
.status-dot.error{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.role-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.role-admin{background:var(--purple-light);color:var(--purple)}
.role-company{background:var(--blue-light);color:var(--blue)}
.role-customer{background:var(--green-light);color:#1E8449}
.role-boarder{background:var(--accent-light);color:#9A7B20}

/* PROGRESS */
.progress-container{background:var(--white);padding:16px 20px;border-bottom:1px solid var(--border)}
.progress-inner{max-width:1100px;margin:0 auto}
.progress-info{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-step{font-size:13px;font-weight:600;color:var(--text)}
.progress-pct{font-size:12px;color:var(--text-light)}
.progress-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .4s ease}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:24px 20px 120px}

/* BUTTONS */
.btn{padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-secondary{background:#666;color:#fff}
.btn-outline{background:var(--white);border:2px solid var(--border);color:var(--text-light)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-block{width:100%;justify-content:center}
.btn-back{background:none;border:1px solid var(--border);color:var(--text-light);padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-weight:500}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--bg)}
.card-header h2{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

.form-card{background:var(--white);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow-md);border:1px solid var(--border)}

/* SECTION HEADERS */
.sec-header{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--primary-light)}
.sec-icon{font-size:28px;margin-bottom:4px}
.sec-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:2px}
.sec-desc{font-size:13px;color:var(--text-light)}
.subsec{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.subsec-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* FORMS */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.fg label .req{color:var(--red);font-weight:700}
.fg .help{font-size:11px;color:var(--text-lighter);margin-top:3px;font-style:italic}
.fc{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);transition:all .2s;font-family:inherit}
.fc:focus{outline:none;border-color:var(--primary);background:var(--white)}
.fc::placeholder{color:var(--text-lighter)}
select.fc{cursor:pointer}
textarea.fc{resize:vertical;min-height:70px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}

.pill-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{padding:7px 16px;border-radius:20px;font-size:13px;border:2px solid var(--border);background:var(--white);color:var(--text-light);cursor:pointer;transition:all .15s;font-weight:500}
.pill:hover{border-color:var(--primary);color:var(--primary)}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;border:1.5px solid var(--border);background:var(--white);color:var(--text-light);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent-light);color:#B8860B;border-color:var(--accent);font-weight:600}
.rating-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.rating-lbl{font-size:10px;color:var(--text-lighter);min-width:55px}
.rating-lbl.r{text-align:right}
.rating-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:var(--white);color:var(--text-lighter);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rating-dot:hover{border-color:var(--primary);color:var(--primary)}
.rating-dot.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.info-box{background:var(--blue-light);border:1px solid #C3DAEF;border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;color:#2C6FAC;margin-bottom:16px}
.warn-box{background:var(--accent-light);border:1px solid #EDD9A3;border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;color:#9A7B20;margin-bottom:16px}
.alert-box{background:var(--red-light);border:1px solid #E8A9A4;border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;color:#B53A2F;margin-bottom:16px}
.ok-box{background:var(--green-light);border:1px solid #A3DFB8;border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;color:#1E8449;margin-bottom:16px}

/* PHOTO & DOCS */
.photo-upload{width:140px;height:140px;border-radius:50%;border:3px dashed var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;margin:0 auto 16px;overflow:hidden;position:relative}
.photo-upload:hover{border-color:var(--primary);background:var(--primary-light)}
.photo-upload img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.photo-upload .ph{text-align:center;color:var(--text-lighter);font-size:11px;z-index:1}
.photo-upload .ph span{font-size:28px;display:block;margin-bottom:2px}
.doc-list{list-style:none}
.doc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px;border:1px solid var(--border)}
.doc-name{display:flex;align-items:center;gap:8px;font-weight:500}
.doc-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;font-weight:700}

/* Photo gallery for boarders */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.photo-thumb{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;position:relative;border:1px solid var(--border);cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .remove{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-add{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);transition:all .2s;font-size:11px;color:var(--text-lighter)}
.photo-add:hover{border-color:var(--primary);background:var(--primary-light)}
.photo-add span{font-size:24px;display:block}

/* NAV BAR */
.nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--white);border-top:1px solid var(--border);padding:12px 20px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.nav-btn{padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.nav-prev{background:var(--white);border:2px solid var(--border);color:var(--text-light)}
.nav-prev:hover{border-color:var(--primary);color:var(--primary)}
.nav-prev:disabled,.nav-next:disabled{opacity:.3;cursor:default}
.nav-next{background:var(--primary);border:none;color:#fff;box-shadow:0 3px 10px rgba(232,101,74,.3)}
.nav-next:hover{background:var(--primary-dark);transform:translateY(-1px)}
.nav-dots{display:flex;gap:4px}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s;border:none}
.nav-dot.done{background:var(--green)}
.nav-dot.current{background:var(--primary);width:20px;border-radius:4px}

/* PROFILE VIEW */
.profile-hero{text-align:center;padding:32px 20px;background:linear-gradient(135deg,var(--primary-light) 0%,#FFF 60%);border-radius:var(--radius);margin-bottom:20px;border:1px solid var(--border)}
.profile-photo-lg{width:120px;height:120px;border-radius:50%;border:4px solid var(--white);box-shadow:var(--shadow-md);object-fit:cover;margin:0 auto 12px;display:block;background:var(--bg)}
.profile-name{font-size:26px;font-weight:800;color:var(--text)}
.profile-sub{font-size:14px;color:var(--text-light);margin-top:2px}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.profile-section{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.profile-section-header{padding:12px 16px;font-weight:700;font-size:14px;background:var(--bg);border-bottom:1px solid var(--border);color:var(--primary)}
.profile-section-body{padding:16px}
.profile-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.profile-row:last-child{border-bottom:none}
.profile-row .lbl{color:var(--text-light);font-weight:500;min-width:100px}
.profile-row .val{color:var(--text);font-weight:600;text-align:right;max-width:60%}

/* ADMIN / COMPANY DASHBOARD */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-val{font-size:2rem;font-weight:800;color:var(--primary)}
.stat-lbl{font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.entity-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.entity-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.entity-card-top{padding:20px;display:flex;align-items:center;gap:14px}
.entity-card-icon{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.entity-card-icon img{width:100%;height:100%;object-fit:cover}
.entity-card-info h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.entity-card-info p{font-size:12px;color:var(--text-light)}
.entity-card-bottom{padding:10px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:11px;color:var(--text-light)}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:var(--white);padding:6px;border-radius:var(--radius);border:1px solid var(--border)}
.tab-btn{padding:10px 18px;background:transparent;border:none;color:var(--text-light);font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);transition:all .2s;white-space:nowrap;font-family:inherit}
.tab-btn:hover{background:var(--bg);color:var(--text)}
.tab-btn.active{background:var(--primary);color:#fff}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--white);border-radius:var(--radius);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.modal-header h3{font-size:18px;font-weight:700;color:var(--text)}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-light)}
.modal-close:hover{color:var(--red)}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table th{background:var(--bg);padding:10px 14px;text-align:left;font-weight:600;color:var(--text);border-bottom:2px solid var(--border)}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
.data-table tr:hover{background:var(--primary-light)}
.code-badge{background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:12px;font-weight:700;letter-spacing:1px}

/* AVAILABILITY */
.avail-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.avail-day{text-align:center;padding:8px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;transition:all .15s;font-size:11px;font-weight:600}
.avail-day.available{background:var(--green-light);border-color:var(--green);color:#1E8449}
.avail-day.unavailable{background:var(--red-light);border-color:var(--red);color:#B53A2F}
.avail-day:hover{transform:scale(1.05)}

.hidden{display:none !important}
.text-center{text-align:center}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.mt-16{margin-top:16px}
.mt-24{margin-top:24px}

@media(max-width:600px){
    .login-card{padding:32px 24px}
    .form-card{padding:20px 16px}
    .fr,.fr3{grid-template-columns:1fr}
    .nav-dots{display:none}
    .profile-grid,.entity-grid,.dog-grid{grid-template-columns:1fr}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .tabs{overflow-x:auto;flex-wrap:nowrap}
}
@media print{.header,.nav-bar,.progress-container{display:none}body{background:#fff}.main{padding:0}}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">🐾</div>
        <div class="login-brand">safe<span>pets</span>.pro</div>
        <div class="login-sub">Dog Profile &amp; Care Management</div>
        <div class="login-field">
            <label>🐾 Pawsome Access Code</label>
            <input type="text" id="loginCode" class="login-input" placeholder="Enter your Pawsome Access Code" maxlength="20" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div id="loginError" class="login-error"></div>
        <button class="login-btn" onclick="doLogin()">Access SafePets.PRO →</button>
        <p class="login-hint">Your Pawsome Access Code was provided by your service provider or boarding company.<br>Contact them if you haven't received one.</p>
    </div>
</div>

<div id="appScreen" class="hidden">
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">safe<span>pets</span>.pro</div>
            <div class="header-right">
                <div class="status-pill"><div class="status-dot" id="statusDot"></div><span id="statusText">Connecting...</span></div>
                <span class="role-badge" id="roleBadge"></span>
                <button class="btn-back" onclick="doLogout()">Logout</button>
            </div>
        </div>
    </header>
    <div class="progress-container hidden" id="progressBar">
        <div class="progress-inner"><div class="progress-info"><span class="progress-step" id="progressLabel"></span><span class="progress-pct" id="progressPct"></span></div><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>
    </div>

async function initFB(){
    try{
        updateStatus('Connecting...','connecting');
        let a=0;while(typeof firebase==='undefined'&&a<50){await new Promise(r=>setTimeout(r,100));a++}
        if(typeof firebase==='undefined')throw new Error('Firebase not loaded');
        if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
        db=firebase.firestore();storage=firebase.storage();
        try{await firebase.auth().signInAnonymously()}catch(e){}
        fbReady=true;updateStatus('Connected','connected');
    }catch(e){console.error('[SafePets]',e);updateStatus('Offline','error')}
}

// ============================================
// LOGIN

async function doLogin(){
    const code=$('loginCode').value.trim().toUpperCase();
    if(code.length<3){$('loginError').textContent='Please enter a valid Pawsome Access Code';return}
    accessCode=code;
    $('loginError').textContent='Checking code...';
    hide('loginScreen');show('appScreen');
    await initFB();
    if(!fbReady){$('loginError').textContent='Cannot connect to server';show('loginScreen');hide('appScreen');return}

    // Check admin
    if(code===ADMIN_CODE){role='admin';setRoleBadge();loadAdminData();return}

    // Check company code
    try{
        var compSnap=await db.collection('safepets_companies').where('accessCode','==',code).limit(1).get();
        if(!compSnap.empty){role='company';companyId=compSnap.docs[0].id;formData=compSnap.docs[0].data();setRoleBadge();loadCompanyData();return}
    }catch(e){console.warn('[SafePets] Company lookup:',e.message)}

    // Check customer code
    try{
        var custSnap=await db.collection('safepets_dogs').where('accessCode','==',code).limit(1).get();
        if(!custSnap.empty){role='customer';var d=custSnap.docs[0];formData={...d.data(),_id:d.id};companyId=formData.companyId||'';photoUrl=formData.photoUrl||null;uploadedDocs=formData.documents||[];setRoleBadge();renderDogProfile(formData);return}
    }catch(e){console.warn('[SafePets] Dog lookup:',e.message)}

    // Check boarder code
    try{
        var bSnap=await db.collection('safepets_boarders').where('accessCode','==',code).limit(1).get();
        if(!bSnap.empty){role='boarder';var d=bSnap.docs[0];formData={...d.data(),_id:d.id};companyId=formData.companyId||'';boarderPhotos=formData.homePhotos||[];setRoleBadge();renderBoarderProfile(formData);return}
    }catch(e){console.warn('[SafePets] Boarder lookup:',e.message)}

    // Invalid code
    show('loginScreen');hide('appScreen');$('loginError').textContent='Invalid Pawsome Access Code. Please check and try again.';
}

function adminTab(tab,btn){

        else{
            h+='<div class="entity-grid">';
            companies.forEach(function(c,i){
                var dCount=dogs.filter(function(d){return d.companyId===c._id}).length;
                var bCount=boarders.filter(function(b){return b.companyId===c._id}).length;
                h+='<div class="entity-card" onclick="viewCompanyAdmin(\''+c._id+'\')"><div class="entity-card-top"><div class="entity-card-icon">🏢</div><div class="entity-card-info"><h3>'+c.companyName+'</h3><p>'+c.contactName+'</p></div></div><div class="entity-card-bottom"><span>🐕 '+dCount+' dogs</span><span>🏠 '+bCount+' boarders</span><span class="code-badge">'+c.accessCode+'</span></div></div>';

async function saveCompany(){
    var name=$('newCompName').value.trim();
    var contact=$('newCompContact').value.trim();
    if(!name||!contact){alert('Company name and contact are required');return}
    var data={companyName:name,contactName:contact,phone:$('newCompPhone').value.trim(),email:$('newCompEmail').value.trim(),address:$('newCompAddr').value.trim(),accessCode:$('newCompCode').value,createdAt:new Date().toISOString(),status:'active'};
    try{var ref=await db.collection('safepets_companies').add(data);data._id=ref.id;companies.unshift(data);closeModal();renderAdminDash();alert('Company registered! Their Pawsome Access Code is: '+data.accessCode)}catch(e){alert('Error: '+e.message)}
}

async function saveDogProfile(){
    if(!fbReady){alert('Not connected');return}
    var btn=$('btnSubmit');if(btn){btn.disabled=true;btn.textContent='Saving...'}
    try{
        if(photoFile){var ref=storage.ref('safepets/photos/'+(formData.accessCode||'x')+'/'+Date.now()+'_'+photoFile.name);var snap=await ref.put(photoFile);formData.photoUrl=await snap.ref.getDownloadURL()}
        for(var i=0;i<uploadedDocs.length;i++){if(uploadedDocs[i]._file){var f=uploadedDocs[i]._file;var ref=storage.ref('safepets/docs/'+(formData.accessCode||'x')+'/'+Date.now()+'_'+f.name);var snap=await ref.put(f);uploadedDocs[i].url=await snap.ref.getDownloadURL();uploadedDocs[i].fileName=f.name;delete uploadedDocs[i]._file}}
        formData.documents=uploadedDocs;formData.updatedAt=new Date().toISOString();
        if(formData._id){var id=formData._id;var sd={...formData};delete sd._id;await db.collection('safepets_dogs').doc(id).update(sd)}
        else{formData.createdAt=new Date().toISOString();var sd={...formData};delete sd._id;var ref=await db.collection('safepets_dogs').add(sd);formData._id=ref.id}
        hide('progressBar');hide('navBar');
        if(role==='customer'){renderDogProfile(formData)}
        else{alert('Dog profile saved! Customer Pawsome Access Code: '+formData.accessCode);loadCompanyData()}
    }catch(e){console.error(e);alert('Error saving');if(btn){btn.disabled=false;btn.textContent='✅ Submit'}}
}

async function saveBoarderProfile(){
    if(!fbReady){alert('Not connected');return}

        if(photoFile){var ref=storage.ref('safepets/boarders/'+(formData.accessCode||'x')+'/profile_'+Date.now());var snap=await ref.put(photoFile);formData.profilePhotoUrl=await snap.ref.getDownloadURL()}
        for(var i=0;i<boarderPhotos.length;i++){if(boarderPhotos[i]._file){var f=boarderPhotos[i]._file;var ref=storage.ref('safepets/boarders/'+(formData.accessCode||'x')+'/home_'+Date.now()+'_'+f.name);var snap=await ref.put(f);boarderPhotos[i].url=await snap.ref.getDownloadURL();delete boarderPhotos[i]._file;delete boarderPhotos[i].preview}}
        formData.homePhotos=boarderPhotos;formData.updatedAt=new Date().toISOString();

}

function addTestimonial(){
    var n=val('_test_name'),t=val('_test_text'),d=val('_test_date');
    if(!n||!t){alert('Please enter client name and testimonial text');return}
    if(!formData.b_testimonials_list)formData.b_testimonials_list=[];
    formData.b_testimonials_list.push({name:n,text:t,date:d||new Date().toISOString().split('T')[0]});
    delete formData._test_name;delete formData._test_text;delete formData._test_date;
    renderSection();
}
function removeTestimonial(i){formData.b_testimonials_list.splice(i,1);renderSection()}

    h+='<div class="profile-section"><div class="profile-section-header">🏡 Facilities</div><div class="profile-section-body">'+pR('Sleep',d.b_sleep_where)+pR('Walks/Day',d.b_walks_per_day)+pR('Walk Duration',d.b_walk_duration)+pR('Walk Location',d.b_walk_location)+pR('Off Lead',d.b_off_lead)+pR('Own Food',d.b_feed_own_food)+pR('Daily Routine',d.b_daily_routine)+'</div></div>';
    h+='<div class="profile-section"><div class="profile-section-header">📅 Availability & Pricing</div><div class="profile-section-body">'+pR('Availability',d.b_avail_general)+pA('Days',d.b_avail_days)+pR('Overnight',d.b_avail_overnight)+pR('Christmas',d.b_avail_holidays)+pR('Day Rate','£'+(d.b_rate_day||'—'))+pR('Night Rate','£'+(d.b_rate_overnight||'—'))+pR('Discount',d.b_rate_additional)+pR('Extra Services',d.b_services_extra)+'</div></div>';
    h+='<div class="profile-section"><div class="profile-section-header">🚨 Emergency</div><div class="profile-section-body">'+pR('Vet',d.b_emerg_vet)+pR('Vet Phone',d.b_emerg_vet_phone)+pR('Emergency Plan',d.b_emerg_plan)+pR('Fire Plan',d.b_fire_plan)+pR('Transport',d.b_transport)+'</div></div>';
    // Photos
    var photos=d.homePhotos||[];
    h+='<div class="profile-section"><div class="profile-section-header">📸 Home Photos ('+photos.length+')</div><div class="profile-section-body">';
    if(photos.length){h+='<div class="photo-grid">';photos.forEach(function(p){h+='<div class="photo-thumb"><img src="'+(p.url||p.preview)+'"></div>'});h+='</div>'}else h+='<p style="color:var(--text-lighter)">No photos</p>';
    h+='</div></div>';
    // Testimonials
    var tests=d.b_testimonials_list||[];
    h+='<div class="profile-section"><div class="profile-section-header">⭐ Testimonials ('+tests.length+')</div><div class="profile-section-body">';
    tests.forEach(function(t){h+='<div style="padding:12px 0;border-bottom:1px solid var(--border)"><strong>'+t.name+'</strong><p style="font-size:13px;color:var(--text);margin:4px 0">\"'+t.text+'\"</p><p style="font-size:11px;color:var(--text-lighter)">'+t.date+'</p></div>'});
    if(!tests.length)h+='<p style="color:var(--text-lighter)">No testimonials yet</p>';
    h+='</div></div></div>';
    mc.innerHTML=h;
}

function enterDogEdit(){
    activeSections=DOG_SECTIONS;activeFormType='dog';
    uploadedDocs=formData.documents||[];photoUrl=formData.photoUrl||null;
    currentSection=0;show('progressBar');show('navBar');renderSection();updateProgress();
}
function enterBoarderEdit(){
    activeSections=BOARDER_SECTIONS;activeFormType='boarder';
    boarderPhotos=formData.homePhotos||[];photoUrl=formData.profilePhotoUrl||null;
    currentSection=0;show('progressBar');show('navBar');renderSection();updateProgress();
}

// ============================================
// NAVIGATION
// ============================================
function nextSection(){if(currentSection<activeSections.length-1){currentSection++;renderSection();updateProgress()}}
function prevSection(){if(currentSection>0){currentSection--;renderSection();updateProgress()}}
function goToSection(i){currentSection=i;renderSection();updateProgress()}
function updateProgress(){
    var p=Math.round(currentSection/(activeSections.length-1)*100);
    $('progressLabel').textContent='Section '+(currentSection+1)+' of '+activeSections.length;
    $('progressPct').textContent=p+'%';$('progressFill').style.width=p+'%';
    $('btnPrev').disabled=currentSection===0;$('btnNext').disabled=currentSection===activeSections.length-1;
    $('btnNext').textContent=currentSection===activeSections.length-1?'Submit ↑':'Next →';
    var dots='';activeSections.forEach(function(s,i){var c='nav-dot';if(i===currentSection)c+=' current';else if(i<currentSection)c+=' done';dots+='<button class="'+c+'" onclick="goToSection('+i+')" title="'+s.title+'"></button>'});
    $('navDots').innerHTML=dots;
}

// ============================================
// MODAL
// ============================================
function openModal(){$('modalOverlay').classList.add('active');document.body.style.overflow='hidden'}
function closeModal(){$('modalOverlay').classList.remove('active');document.body.style.overflow=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded',function(){$('loginCode').focus()});
</script>
