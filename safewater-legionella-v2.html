<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SafeWater.PRO Legionella v2 (HSG274)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
:root{
  --blue:#4A90E2; --blue-d:#2E6DB4; --blue-l:#6AABF7;
  --orange:#CC5500;
  --ok:#28A745; --warn:#FFC107; --high:#FF6B35; --bad:#DC3545;
  --bg:#141416; --panel:#1d1d20; --panel-2:#252529; --line:#33333a;
  --txt:#e9e9ec; --txt-2:#a6a6ad; --txt-3:#75757e;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--blue-l)}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9000}
#login .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:400px;width:100%}
#login h1{font-size:1.35rem;margin:0 0 4px}
#login p{color:var(--txt-2);font-size:.9rem;margin:0 0 20px}

/* ── HEADER ── */
.hdr{background:linear-gradient(160deg,#232327,#161618);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hdr .brand{font-weight:800;font-size:1.1rem;letter-spacing:-.2px}
.hdr .brand span{color:var(--blue)}
.hdr .sub{color:var(--txt-3);font-size:.78rem}
.hdr .who{text-align:right;font-size:.8rem;color:var(--txt-2)}

/* ── NAV ── */
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.nav button{flex:0 0 auto;background:var(--panel);color:var(--txt-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-family:var(--font);font-size:.87rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.nav button:hover{color:var(--txt);border-color:#44444d}
.nav button.on{background:var(--blue-d);border-color:var(--blue);color:#fff}

/* ── CARDS ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:.95rem;color:var(--blue-l);font-weight:700}
.card h3 .n{color:var(--txt-3);font-weight:500}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ── TILES ── */
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.tile .v{font-size:1.8rem;font-weight:800;line-height:1.1}
.tile .l{font-size:.74rem;color:var(--txt-3);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}

/* ── FORMS ── */
label{display:block;font-size:.82rem;color:var(--txt-2);margin-bottom:5px;font-weight:500}
.req{color:var(--bad)}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:11px 12px;font-family:var(--font);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical}
.fg{margin-bottom:12px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue-d);color:#fff;border:1px solid var(--blue);border-radius:9px;padding:10px 16px;font-family:var(--font);font-size:.87rem;font-weight:600;cursor:pointer;min-height:42px;transition:.15s}
.btn:hover{background:var(--blue)}
.btn.o{background:transparent;color:var(--txt-2);border-color:var(--line)}
.btn.o:hover{color:var(--txt);border-color:#4a4a55;background:var(--panel-2)}
.btn.g{background:#1e7e34;border-color:var(--ok)}
.btn.r{background:#a71d2a;border-color:var(--bad)}
.btn.w{background:#8a6d00;border-color:var(--warn)}
.btn.sm{padding:7px 12px;font-size:.8rem;min-height:34px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ── LIST ROWS ── */
.row{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:.92rem;margin-bottom:3px}
.row .m{font-size:.79rem;color:var(--txt-3);line-height:1.6}
.row.clickable{cursor:pointer}
.row.clickable:hover{border-color:var(--blue-d)}

/* ── PILLS ── */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.p-ok{background:rgba(40,167,69,.16);color:#5dd97b;border:1px solid rgba(40,167,69,.4)}
.p-warn{background:rgba(255,193,7,.14);color:#ffcf3d;border:1px solid rgba(255,193,7,.4)}
.p-high{background:rgba(255,107,53,.15);color:#ff9166;border:1px solid rgba(255,107,53,.4)}
.p-bad{background:rgba(220,53,69,.16);color:#ff707d;border:1px solid rgba(220,53,69,.45)}
.p-grey{background:rgba(150,150,160,.12);color:var(--txt-3);border:1px solid var(--line)}

/* ── BARS ── */
.bar{height:7px;background:var(--panel-2);border-radius:6px;overflow:hidden;margin-top:7px;border:1px solid var(--line)}
.bar i{display:block;height:100%}

.note{background:rgba(74,144,226,.09);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.88rem;margin-bottom:14px}
.note.w{background:rgba(255,193,7,.09);border-left-color:var(--warn)}
.note.r{background:rgba(220,53,69,.09);border-left-color:var(--bad)}
.note.g{background:rgba(40,167,69,.09);border-left-color:var(--ok)}
.empty{text-align:center;padding:34px 16px;color:var(--txt-3);font-size:.9rem}
.ref{font-size:.75rem;color:var(--blue-l);margin-top:3px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:8000;overflow-y:auto}
.mo.on{display:flex}
.mo .m{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:660px;width:100%;margin:auto}
.mo .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mo .mh h3{margin:0;font-size:1rem;color:var(--blue-l)}
.x{background:none;border:none;color:var(--txt-3);font-size:1.5rem;cursor:pointer;line-height:1;padding:0 4px}

/* ── PHOTOS ── */
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.ph .t{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ph .t img{width:100%;height:100%;object-fit:cover;display:block}
.ph .t b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.75);color:#fff;border-radius:50%;width:19px;height:19px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.up input[type=file]{display:none}

/* ── CHECK ── */
.ck{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:7px}
.ck input{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--blue)}
.ck .lb{flex:1;font-size:.88rem}
.ck .lb b{display:block;margin-bottom:2px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--blue);border-radius:10px;padding:12px 20px;font-size:.88rem;z-index:9500;display:none;max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.6)}
.crumb{font-size:.82rem;color:var(--txt-3);margin-bottom:10px}
.crumb b{color:var(--blue-l);cursor:pointer}
.sp{border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;width:26px;height:26px;animation:s 1s linear infinite;margin:26px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media print{
  .nav,.hdr,.btn,.btns,.crumb,#toast,.mo{display:none!important}
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt}
  .wrap{max-width:100%;padding:0}
  .card{background:#fff!important;border:none!important;padding:0!important;margin:0 0 10pt!important;border-radius:0!important}
  .card h3{color:#000!important;font-size:11pt;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin:14pt 0 8pt}
  .row{background:#fff!important;border:none!important;border-bottom:.5pt solid #bbb!important;border-radius:0!important;padding:5pt 0!important;margin:0!important}
  .row .t{color:#000!important;font-size:10pt}
  .row .m,.ref{color:#333!important;font-size:8.5pt}
  .pill{border:.5pt solid #666!important;color:#000!important;background:#fff!important}
  .note{background:#f4f4f4!important;border-left:2pt solid #666!important;color:#000!important;page-break-inside:avoid}
  .bar{display:none}
  .ph .t{width:150pt;height:auto}
  .ph img{max-height:150pt}
  .rp-page{page-break-after:always}
  .rp-page:last-child{page-break-after:auto}
  .rp-hd{border-bottom:2.5pt solid #000;padding-bottom:8pt;margin-bottom:14pt}
  .rp-hd .ti{font-size:17pt;font-weight:800;line-height:1.2}
  .rp-hd .su{font-size:10pt;color:#333}
  .rp-meta{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:12pt}
  .rp-meta td{border:.5pt solid #999;padding:4pt 6pt}
  .rp-meta td:nth-child(odd){background:#eee;font-weight:600;width:22%}
  .rp-t{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:10pt}
  .rp-t th{background:#e4e4e4;border:.5pt solid #999;padding:4pt;text-align:left;font-weight:700}
  .rp-t td{border:.5pt solid #999;padding:4pt;vertical-align:top}
  .sig{margin-top:20pt;border-top:.5pt solid #999;padding-top:10pt;font-size:9pt}
  h2.rp-s{font-size:12pt;margin:16pt 0 6pt;border-bottom:1pt solid #000;padding-bottom:3pt}
  p.rp-p{font-size:9.5pt;line-height:1.5;margin:0 0 7pt;text-align:justify}
  .avoid{page-break-inside:avoid}
}
/* on-screen report styling */
.rp-hd{border-bottom:2px solid var(--blue);padding-bottom:12px;margin-bottom:16px}
.rp-hd .ti{font-size:1.4rem;font-weight:800;line-height:1.25}
.rp-hd .su{font-size:.86rem;color:var(--txt-3);margin-top:4px}
.rp-meta{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:14px}
.rp-meta td{border:1px solid var(--line);padding:7px 9px}
.rp-meta td:nth-child(odd){background:var(--panel-2);font-weight:600;width:22%;color:var(--txt-2)}
.rp-t{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:12px}
.rp-t th{background:var(--panel-2);border:1px solid var(--line);padding:7px;text-align:left;color:var(--blue-l);font-weight:700}
.rp-t td{border:1px solid var(--line);padding:7px;vertical-align:top}
h2.rp-s{font-size:1rem;color:var(--blue-l);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
p.rp-p{font-size:.9rem;line-height:1.65;margin:0 0 9px}
.sig{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;font-size:.85rem;color:var(--txt-2)}
.tbl-wrap{overflow-x:auto}
</style>
</head>
<body>

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today = () => new Date().toISOString().slice(0,10);
const days = (a,b) => Math.floor((new Date(b)-new Date(a))/86400000);
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10);}
function fmt(d){ if(!d) return 'Not recorded'; const p=String(d).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

function toast(m,ms){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||3000); }
function openMo(title,html){ $('moTitle').textContent=title; $('moBody').innerHTML=html; $('modal').classList.add('on'); }
function closeMo(){ $('modal').classList.remove('on'); }

  startSession(code,u);
}
function startSession(code,u){
  me={uid:'lrav2_'+code.toLowerCase(), name:u.name, org:u.org, code:code, level:u.level};
  $('login').style.display='none';
  $('app').style.display='block';

}

(function autoLogin(){
  const q=new URLSearchParams(location.search);
  const code=q.get('access_code')||q.get('accessCode')||'';
  if(code && ACCESS_CODES[code]) startSession(code,ACCESS_CODES[code]);
})();

  const d=e.data||{};
  if(d.type==='safecore-auth-success' && d.accessCode && ACCESS_CODES[d.accessCode] && !me.uid)
    startSession(d.accessCode, ACCESS_CODES[d.accessCode]);
});

/* ════════ DATA ════════ */
async function fetchAll(){
  const q = c => db.collection(c).where('uid','==',me.uid).get()
      .then(s=>s.docs.map(d=>({id:d.id,...d.data()})))
      .catch(e=>{ console.error(c,e); return []; });
  [P,A,E,ACT,ASS,SCH,DOC] = await Promise.all([q(C.props),q(C.assets),q(C.events),q(C.actions),q(C.assess),q(C.schemes),q(C.docs)]);
  E.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
async function boot(){ render('<div class="sp"></div>'); await fetchAll(); go(view.screen); }

async function save(col,id,data){
  data.uid=me.uid;
  data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  if(id) return db.collection(col).doc(id).update(data);
  data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  return db.collection(col).add(data);
}
async function del(col,id){ return db.collection(col).doc(id).delete(); }

/* ════════ SCHEDULER ════════ */
function assetTasks(asset){
  const reg = REGIMES[asset.type]||[];
  return reg.map(r=>{
    const evs = E.filter(e=>e.assetId===asset.id && e.kind===r.kind && (!e.taskId || e.taskId===r.id));
    const last = evs.length ? evs[0].date : null;
    const due  = last ? addDays(last, r.days) : null;
    let status='never', over=0;
    if(due){
      over = days(due, today());
      status = over>0 ? 'overdue' : (over > -7 ? 'soon' : 'ok');
    }
    return {...r, last, due, status, over};
  });
}
function propTasks(pid){
  const out=[];
  A.filter(a=>a.propId===pid).forEach(a=>assetTasks(a).forEach(t=>out.push({...t,asset:a})));
  return out;
}
function allTasks(){
  const out=[];
  A.forEach(a=>assetTasks(a).forEach(t=>out.push({...t,asset:a})));
  return out;
}

/* ════════ SCORECARD ════════ */
function scorecard(pid){
  const p=P.find(x=>x.id===pid)||{};
  const assets=A.filter(a=>a.propId===pid);
  const tasks=propTasks(pid);
  const ok=tasks.filter(t=>t.status==='ok'||t.status==='soon').length;
  const pct = tasks.length ? Math.round(ok/tasks.length*100) : 0;
  const ass = ASS.filter(a=>a.propId===pid).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  const raCurrent = ass && ass.reviewDate && ass.reviewDate>=today();
  const scheme = SCH.some(s=>s.propId===pid);
  const rp = !!(p.rp&&p.rp.trim()&&p.rp.toUpperCase().indexOf('TO CONFIRM')<0);
  const openA = ACT.filter(a=>a.propId===pid&&a.status!=='closed');
  const imm = openA.filter(a=>a.priority==='immediate').length;

  const checks=[
    {k:'Risk assessment current',      v:raCurrent, d: ass? ('reviewed '+fmt(ass.date)) : 'none recorded'},
    {k:'Written scheme in place',      v:scheme,    d: scheme?'present':'missing'},
    {k:'Responsible person named',     v:rp,        d: rp?p.rp:'not named'},
    {k:'Asset register populated',     v:assets.length>0, d: assets.length+' assets'},
    {k:'Monitoring up to date',        v:pct>=90,   d: pct+'% of tasks in date'},
    {k:'No immediate actions open',    v:imm===0,   d: imm+' immediate'}
  ];
  const pass=checks.filter(c=>c.v).length;
  const score=Math.round(pass/checks.length*100);
  const rag = score>=85 && imm===0 ? 'ok' : score>=55 ? 'warn' : 'bad';
  return {checks,score,rag,pct,tasks,assets,openA,imm};
}

/* ════════ GAP DETECTION ════════ */
function gaps(pid){
  const g=[];
  const p=P.find(x=>x.id===pid)||{};
  const assets=A.filter(a=>a.propId===pid);
  if(!assets.length) g.push({s:'bad',t:'No assets registered',d:'The asset register is the basis of the assessment. Nothing can be scheduled until assets exist.'});
  if(!p.rp||/TO CONFIRM/i.test(p.rp||'')) g.push({s:'bad',t:'No responsible person named',d:'L8 requires a named responsible person. The written scheme cannot be completed without one.'});
  if(!SCH.some(s=>s.propId===pid)) g.push({s:'warn',t:'No written scheme of control',d:'HSG274 Pt2 2.70 requires a written scheme for each system presenting a risk.'});
  const ass=ASS.filter(a=>a.propId===pid);
  if(!ass.length) g.push({s:'bad',t:'No risk assessment recorded',d:'A suitable and sufficient assessment is a legal requirement.'});
  else{ const l=ass.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
        if(l.reviewDate && l.reviewDate<today()) g.push({s:'bad',t:'Risk assessment overdue for review',d:'Review date was '+fmt(l.reviewDate)+'.'}); }
  assets.forEach(a=>{
    if(!REGIMES[a.type]) return;
    assetTasks(a).forEach(t=>{
      if(t.status==='never') g.push({s:'warn',t:'No '+t.task.toLowerCase()+' ever recorded',d:a.ref+' &middot; '+(a.location||''),aid:a.id});
      else if(t.status==='overdue') g.push({s:'bad',t:t.task+' overdue by '+t.over+' days',d:a.ref+' &middot; '+(a.location||''),aid:a.id});
    });
  });
  if(assets.some(a=>a.type==='cooling_tower') && !p.ltNotified)
    g.push({s:'bad',t:'Cooling tower not notified to local authority',d:'Notification is a statutory requirement under COSHH.'});
  const showers=assets.filter(a=>a.type==='shower_fixed'||a.type==='shower_flex');
  if(showers.length && !E.some(e=>e.kind==='disinfection'&&showers.some(s=>s.id===e.assetId)))
    g.push({s:'warn',t:'Showers registered with no disinfection record',d:showers.length+' shower(s) on the register.'});
  return g;
}

  ['today','Today'],['sites','Sites'],['survey','Survey'],
  ['actions','Actions'],['assess','Assessments'],['schemes','Schemes'],

function go(s,arg){
  view.screen=s;
  if(s==='property') view.propId=arg||view.propId;
  if(s==='asset')    view.assetId=arg||view.assetId;
  drawNav();
  ({today:scToday,sites:scSites,property:scProperty,asset:scAsset,survey:scSurvey,

/* ════════ SCREEN: TODAY ════════ */
function scToday(){
  const t=allTasks();
  const over=t.filter(x=>x.status==='overdue').sort((a,b)=>b.over-a.over);
  const soon=t.filter(x=>x.status==='soon');
  const never=t.filter(x=>x.status==='never');
  const openA=ACT.filter(a=>a.status!=='closed');
  const imm=openA.filter(a=>a.priority==='immediate');

  let h='<div class="grid g4">'+
    tile(over.length, 'Overdue', over.length?'var(--bad)':'var(--ok)','today')+
    tile(soon.length, 'Due within 7 days','var(--warn)','today')+
    tile(never.length,'Never done', never.length?'var(--high)':'var(--ok)','today')+
    tile(openA.length,'Open actions', imm.length?'var(--bad)':'var(--blue)','actions')+
  '</div>';

  if(imm.length) h+='<div class="note r"><b>'+imm.length+' immediate action'+(imm.length>1?'s':'')+' outstanding.</b> These are stop-or-isolate items.</div>';

  if(!P.length) h+='<div class="note">No properties yet. Go to <b>Setup</b> to import from the v1 module, or add a property under <b>Sites</b>.</div>';

  h+='<div class="card"><h3>Overdue <span class="n">'+over.length+'</span></h3>'+
     (over.length? over.slice(0,25).map(taskRow).join('') : '<div class="empty">Nothing overdue.</div>')+'</div>';
  h+='<div class="card"><h3>Due soon <span class="n">'+soon.length+'</span></h3>'+
     (soon.length? soon.map(taskRow).join('') : '<div class="empty">Nothing due in the next 7 days.</div>')+'</div>';
  if(never.length)
    h+='<div class="card"><h3>Never recorded <span class="n">'+never.length+'</span></h3>'+
       never.slice(0,25).map(taskRow).join('')+'</div>';
  render(h);
}
function tile(v,l,c,go_){ return '<div class="tile" onclick="go(\''+go_+'\')"><div class="v" style="color:'+c+'">'+v+'</div><div class="l">'+l+'</div></div>'; }
function taskRow(t){
  const p=P.find(x=>x.id===t.asset.propId);
  const pill = t.status==='overdue'? '<span class="pill p-bad">'+t.over+'d overdue</span>'
             : t.status==='soon'   ? '<span class="pill p-warn">due '+fmt(t.due)+'</span>'
             : '<span class="pill p-grey">never done</span>';
  return '<div class="row clickable" onclick="go(\'asset\',\''+t.asset.id+'\')"><div class="main">'+
    '<div class="t">'+esc(t.task)+'</div>'+
    '<div class="m">'+esc(t.asset.ref||'')+' &middot; '+esc(t.asset.location||'')+' &middot; '+esc(p?p.name:'')+
    '<div class="ref">'+esc(t.ref)+'</div></div></div><div>'+pill+'</div></div>';
}

/* ════════ SCREEN: ACTIONS ════════ */
function scActions(){
  const order={immediate:0,high:1,medium:2,low:3};
  const rows=ACT.slice().sort((a,b)=>(order[a.priority]||9)-(order[b.priority]||9));
  const open=rows.filter(a=>a.status!=='closed');
  let h='<div class="btns" style="margin-bottom:14px"><button class="btn" onclick="raiseAction()">+ Raise Action</button></div>';
  h+='<div class="card"><h3>Open <span class="n">'+open.length+'</span></h3>'+
     (open.length? open.map(actionRow).join('') : '<div class="empty">No open actions.</div>')+'</div>';
  const closed=rows.filter(a=>a.status==='closed');
  if(closed.length) h+='<div class="card"><h3>Closed <span class="n">'+closed.length+'</span></h3>'+closed.map(actionRow).join('')+'</div>';
  render(h);
}
function actionRow(a){
  const p=P.find(x=>x.id===a.propId);
  const pc={immediate:'p-bad',high:'p-high',medium:'p-warn',low:'p-ok'}[a.priority]||'p-grey';
  const over=a.due&&a.status!=='closed'&&a.due<today();
  return '<div class="row"><div class="main"><div class="t">'+esc(a.title)+'</div>'+
    '<div class="m">'+esc(p?p.name:'')+(a.assetRef?' &middot; '+esc(a.assetRef):'')+
    (a.owner?' &middot; '+esc(a.owner):'')+(a.due?' &middot; due '+fmt(a.due):'')+
    (over?' <b style="color:var(--bad)">OVERDUE</b>':'')+
    (a.detail?'<br>'+esc(a.detail):'')+(a.ref?'<div class="ref">'+esc(a.ref)+'</div>':'')+'</div></div>'+
    '<div style="text-align:right"><span class="pill '+pc+'">'+esc(a.priority||'')+'</span><br>'+
    '<button class="btn o sm" style="margin-top:6px" onclick="raiseAction(null,null,\''+a.id+'\')">Edit</button></div></div>';
}

const DOC_KINDS=[
  ['schematic','System schematic / pipework drawing'],
  ['asbuilt','As-built drawing'],
  ['floorplan','Floor plan / site plan'],
  ['lab','Laboratory report / certificate of analysis'],
  ['disinfcert','Disinfection or chlorination certificate'],
  ['om','O&M manual / commissioning record'],
  ['warrant','Building warrant / completion certificate'],
  ['scheme','Written scheme (external document)'],
  ['prevra','Previous risk assessment'],
  ['servicing','Servicing or maintenance record'],
  ['correspond','Correspondence'],
  ['other','Other']
];
const DOC_MAX = 700*1024;   /* Firestore document limit is ~1MB; leave headroom */

function scDocs(){
  let h='<div class="note">Uploads are stored in Firestore against the property, and where relevant against a '+
   'specific asset. Images are compressed. PDFs are stored as supplied, so keep them under 700KB or split them.</div>'+
   '<div class="card"><div class="grid g2">'+
     '<div class="fg"><label>Property</label><select id="dcFilter" onchange="renderDocs()">'+
       '<option value="">All properties</option>'+P.map(p=>'<option value="'+p.id+'"'+(p.id===view.propId?' selected':'')+'>'+esc(p.name)+'</option>').join('')+
     '</select></div>'+
     '<div class="fg"><label>&nbsp;</label><button class="btn" style="width:100%" onclick="editDoc()">+ Upload document</button></div>'+
   '</div></div><div id="dcList"></div>';
  render(h); renderDocs();
}
function renderDocs(){
  const f=($('dcFilter')||{}).value||'';
  let rows=DOC.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(f) rows=rows.filter(d=>d.propId===f);
  const el=$('dcList'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No documents uploaded.</div>'; return; }
  const byKind={};
  rows.forEach(d=>{ (byKind[d.kind]=byKind[d.kind]||[]).push(d); });
  let h='';
  DOC_KINDS.forEach(k=>{
    const list=byKind[k[0]]; if(!list) return;
    h+='<div class="card"><h3>'+esc(k[1])+' <span class="n">'+list.length+'</span></h3>'+
      list.map(docRow).join('')+'</div>';
  });
  el.innerHTML=h;
}
function docRow(d){
  const p=P.find(x=>x.id===d.propId), a=A.find(x=>x.id===d.assetId);
  const kb=d.size?Math.round(d.size/1024)+'KB':'';
  return '<div class="row"><div class="main"><div class="t">'+esc(d.title||d.filename||'Untitled')+'</div>'+
    '<div class="m">'+esc(p?p.name:'')+(a?' &middot; '+esc(a.ref||''):'')+' &middot; '+fmt(d.date)+
    (kb?' &middot; '+kb:'')+(d.filename?'<br>'+esc(d.filename):'')+
    (d.notes?'<br>'+esc(d.notes):'')+'</div></div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">'+
      '<button class="btn o sm" onclick="openDoc(\''+d.id+'\')">View</button>'+
      '<button class="btn o sm" onclick="editDoc(\''+d.id+'\')">Edit</button>'+
      '<button class="btn r sm" onclick="delDoc(\''+d.id+'\')">Delete</button></div></div>';
}
function openDoc(id){
  const d=DOC.find(x=>x.id===id); if(!d) return;
  if(!d.data){ toast('No file stored on this record.'); return; }
  if((d.mime||'').indexOf('image')===0)
    openMo(d.title||'Document','<img src="'+d.data+'" style="width:100%;border-radius:8px">'+
      '<div class="btns" style="margin-top:12px"><a class="btn o" href="'+d.data+'" download="'+esc(d.filename||'document')+'">Download</a>'+
      '<button class="btn o" onclick="closeMo()">Close</button></div>');
  else
    openMo(d.title||'Document','<div class="note">'+esc(d.filename||'File')+' ('+Math.round((d.size||0)/1024)+'KB)</div>'+
      '<div class="btns"><a class="btn" href="'+d.data+'" download="'+esc(d.filename||'document')+'">Download</a>'+
      '<button class="btn o" onclick="closeMo()">Close</button></div>');
}
function editDoc(id){
  const d=id?DOC.find(x=>x.id===id):{propId:view.propId||(P[0]||{}).id,date:today()};
  openMo(id?'Edit Document':'Upload Document',
    '<div class="grid g2">'+
      '<div class="fg"><label>Property <span class="req">*</span></label><select id="dcProp">'+
        P.map(p=>'<option value="'+p.id+'"'+(d.propId===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
      '<div class="fg"><label>Document type</label><select id="dcKind">'+
        DOC_KINDS.map(k=>'<option value="'+k[0]+'"'+(d.kind===k[0]?' selected':'')+'>'+esc(k[1])+'</option>').join('')+'</select></div></div>'+

    '<div class="grid g2">'+fld('Title','dcTitle',d.title,'text',true)+fld('Document date','dcDate',d.date,'date')+'</div>'+
    txt('Notes','dcNotes',d.notes)+
    (d.filename?'<div class="note">Currently stored: '+esc(d.filename)+' ('+Math.round((d.size||0)/1024)+'KB). Uploading a new file replaces it.</div>':'')+
    fileField('File (image or PDF, max 700KB)','dcFile')+
    '<div class="btns"><button class="btn" onclick="saveDoc(\''+(id||'')+'\')">Save</button>'+
    (id?'<button class="btn r" onclick="delDoc(\''+id+'\')">Delete</button>':'')+
    '<button class="btn o" onclick="closeMo()">Cancel</button></div>');
}
async function saveDoc(id){
  const title=$('dcTitle').value.trim();
  if(!title){ toast('Title is required.'); return; }
  const d={propId:$('dcProp').value, kind:$('dcKind').value, assetId:$('dcAsset').value,
    title:title, date:$('dcDate').value||today(), notes:$('dcNotes').value.trim()};
  const f=FB['dcFile'];
  if(f){
    if(f.data.length>DOC_MAX*1.37){
      toast('File too large. Firestore allows about 700KB. Compress or split it.');
      return;
    }
    d.filename=f.name; d.mime=f.type; d.data=f.data; d.size=Math.round(f.data.length*0.75);
  } else if(!id){
    toast('Select a file to upload.'); return;
  }
  try{ await save(C.docs,id,d); delete FB['dcFile']; await fetchAll(); closeMo(); toast('Document saved.'); scDocs(); }
  catch(e){ toast('Failed: '+e.message); }
}
async function delDoc(id){
  if(!confirm('Delete this document?')) return;
  try{ await del(C.docs,id); await fetchAll(); closeMo(); toast('Document deleted.'); scDocs(); }
  catch(e){ toast('Failed: '+e.message); }
}

const PRI={immediate:'Immediate',high:'High',medium:'Medium',low:'Low'};
const PRI_T={immediate:'Before further use of the system',high:'Within 7 days',medium:'Within 1 month',low:'Within 3 months'};

function buildDoc(){
  const pid=$('rpProp').value, kind=$('rpKind').value, p=P.find(x=>x.id===pid);
  if(!p){ toast('Select a property.'); return; }
  const out=$('rpOut');
  if(kind==='lra')  out.innerHTML=docLRA(p);
  if(kind==='plan') out.innerHTML=docPlan(p);
  if(kind==='mon')  out.innerHTML=docMon(p);
  if(kind==='exec') out.innerHTML=docExec(p);
  window.scrollTo(0,document.getElementById('rpOut').offsetTop-20);
}

/* ── FULL LRA REPORT ── */
function docLRA(p){
  const s=scorecard(p.id), g=gaps(p.id);
  const assets=A.filter(a=>a.propId===p.id);
  const ass=ASS.filter(a=>a.propId===p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  const acts=ACT.filter(a=>a.propId===p.id&&a.status!=='closed');
  const evs=E.filter(e=>e.propId===p.id);
  const ref=(p.ref||'OB-LRA')+'-'+today().replace(/-/g,'');

  let h='<div class="card rp-page">'+rpHead(p,'Legionella Risk Assessment',ref);

  h+='<h2 class="rp-s">1. Scope and Purpose</h2>'+
   '<p class="rp-p">This Legionella Risk Assessment has been prepared in accordance with the Health and Safety at Work etc. '+
   'Act 1974, the Control of Substances Hazardous to Health Regulations 2002 (COSHH), and the Approved Code of Practice '+
   'and Guidance L8, Legionnaires\' Disease: The Control of Legionella Bacteria in Water Systems, together with HSG274 '+
   'Parts 1 to 3.</p>'+
   '<p class="rp-p">The purpose of this assessment is to identify and assess the risk of exposure to Legionella bacteria '+
   'from the water systems at the premises named above, to identify the control measures required, and to specify the '+
   'remedial actions necessary to reduce risk so far as is reasonably practicable.</p>';
  if(ass&&ass.limits) h+='<p class="rp-p"><b>Scope limitations.</b> '+esc(ass.limits)+'</p>';
  else h+='<p class="rp-p"><b>Scope limitations.</b> No limitations recorded. Where any part of a system could not be '+
   'accessed or inspected, this must be stated before the assessment is issued.</p>';

  h+='<h2 class="rp-s">2. Duty Holder and Responsible Person</h2>'+
   '<p class="rp-p">The duty holder for these premises is recorded as '+esc(p.dutyHolder||'not recorded')+'. '+
   (p.rp&&!/TO CONFIRM|NOT APPOINTED/i.test(p.rp)
     ? 'The appointed responsible person is '+esc(p.rp)+'.'
     : '<b>No responsible person is currently appointed in writing. This is a legal deficiency requiring immediate correction, '+
       'as the written scheme of control cannot be implemented without a named, competent responsible person.</b>')+'</p>';

  h+='<h2 class="rp-s">3. Premises Description</h2>'+
   '<p class="rp-p">'+esc(p.notes||'No description recorded.')+'</p>';
  if(p.year) h+='<p class="rp-p"><b>Age / last refurbishment:</b> '+esc(p.year)+'</p>';

  h+='</div><div class="card rp-page">';

  /* ── ASSET REGISTER ── */
  h+='<h2 class="rp-s">4. Water Systems and Asset Register</h2>'+
   '<p class="rp-p">The following '+assets.length+' assets have been identified and registered. '+
   'Each is subject to the monitoring and inspection regime set out in Section 6.</p>';
  if(!assets.length) h+='<p class="rp-p"><b>No assets registered. The assessment cannot be considered suitable and sufficient.</b></p>';
  else{
    h+='<div class="tbl-wrap"><table class="rp-t"><thead><tr><th>Ref</th><th>Asset type</th><th>Location</th>'+
      '<th>Serving</th><th>Risk</th><th>Status</th></tr></thead><tbody>'+
      assets.map(a=>'<tr><td>'+esc(a.ref||'')+'</td><td>'+esc((TYPES[a.type]||{}).label||a.type)+'</td>'+
      '<td>'+esc(a.location||'')+'</td><td>'+esc(a.serving||'')+'</td><td>'+esc((a.risk||'').toUpperCase())+'</td>'+
      '<td>'+esc(a.status||'Not verified')+'</td></tr>').join('')+'</tbody></table></div>';
  }

  /* ── POPULATION ── */
  h+='<h2 class="rp-s">5. Population at Risk</h2>';
  const pop=(ass&&ass.pop)?ass.pop:[];
  if(pop.length) h+='<p class="rp-p">The following groups have been identified as potentially exposed: '+
    pop.map(esc).join(', ')+'.</p>';
  else h+='<p class="rp-p">Population at risk not recorded on the current assessment. This must be completed, '+
    'as susceptibility directly affects the risk rating.</p>';
  if(ass&&(ass.rf||[]).length){
    h+='<p class="rp-p"><b>Risk factors identified as present:</b></p><table class="rp-t"><thead><tr><th>Risk factor</th><th>Guidance</th></tr></thead><tbody>'+
      RISKF.filter(x=>ass.rf.indexOf(x[0])>=0).map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table>';
  }
  h+='<p class="rp-p">Susceptibility to Legionnaires\' disease is increased in persons over 45 years of age, smokers '+
    'and heavy drinkers, those with chronic respiratory or renal disease, diabetes, cancer, and any person with an '+
    'impaired immune system.</p>';

  h+='</div><div class="card rp-page">';

  /* ── REGIME ── */
  h+='<h2 class="rp-s">6. Control Measures and Monitoring Regime</h2>'+
   '<p class="rp-p">The following regime applies to the registered assets, derived from HSG274. '+
   '"Last completed" reflects records held in SafeSystems.PRO at the date of this report.</p>';
  const ts=propTasks(p.id);
  if(!ts.length) h+='<p class="rp-p">No monitoring regime applicable to the registered assets.</p>';
  else h+='<div class="tbl-wrap"><table class="rp-t"><thead><tr><th>Asset</th><th>Task</th><th>Frequency</th>'+
    '<th>Guidance</th><th>Last completed</th><th>Status</th></tr></thead><tbody>'+
    ts.map(t=>'<tr><td>'+esc(t.asset.ref||'')+'</td><td>'+esc(t.task)+'</td>'+
    '<td>Every '+t.days+' days</td><td>'+esc(t.ref)+'</td><td>'+fmt(t.last)+'</td>'+
    '<td>'+(t.status==='overdue'?'<b>OVERDUE '+t.over+'d</b>':t.status==='never'?'<b>NEVER RECORDED</b>':t.status==='soon'?'Due '+fmt(t.due):'In date')+
    '</td></tr>').join('')+'</tbody></table></div>';

  h+='<h2 class="rp-s">7. Compliance Position</h2>'+
   '<p class="rp-p">Overall compliance score at date of assessment: <b>'+s.score+'%</b>. '+
   'Monitoring tasks in date: <b>'+s.pct+'%</b>.</p>'+
   '<table class="rp-t"><thead><tr><th>Requirement</th><th>Position</th><th>Detail</th></tr></thead><tbody>'+
   s.checks.map(x=>'<tr><td>'+esc(x.k)+'</td><td>'+(x.v?'Compliant':'<b>Not compliant</b>')+'</td><td>'+esc(x.d)+'</td></tr>').join('')+
   '</tbody></table>';

  h+='</div><div class="card rp-page">';

  /* ── FINDINGS ── */
  h+='<h2 class="rp-s">8. Findings and Deficiencies</h2>';
  if(!g.length) h+='<p class="rp-p">No deficiencies identified.</p>';
  else h+='<p class="rp-p">'+g.length+' matters were identified requiring attention.</p>'+
    '<table class="rp-t"><thead><tr><th>#</th><th>Finding</th><th>Detail</th><th>Category</th></tr></thead><tbody>'+
    g.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.t)+'</td><td>'+esc(x.d)+'</td>'+
    '<td>'+(x.s==='bad'?'Action required':'Review')+'</td></tr>').join('')+'</tbody></table>';

  /* ── NARRATIVE ── */
  h+='<h2 class="rp-s">9. Assessor Narrative and Risk Rating</h2>';
  if(ass){
    h+='<p class="rp-p"><b>Overall risk rating: '+esc(ass.rating||'not stated')+'</b>'+
      ((ass.lik||ass.con)?' &nbsp;(Likelihood: '+esc(ass.lik||'\u2014')+' &middot; Consequence: '+esc(ass.con||'\u2014')+')':'')+
      (ass.qual?'<br>Assessor qualifications: '+esc(ass.qual):'')+'</p>'+
      '<p class="rp-p">'+esc(ass.note||'No narrative recorded.')+'</p>'+
      '<p class="rp-p"><b>Assessment date:</b> '+fmt(ass.date)+' &middot; <b>Next review due:</b> '+fmt(ass.reviewDate)+
      (ass.reviewDate&&ass.reviewDate<today()?' <b>(OVERDUE)</b>':'')+'</p>';
  } else h+='<p class="rp-p"><b>No assessment record exists for these premises.</b> '+
    'A suitable and sufficient assessment must be recorded and signed by a competent person.</p>';

  h+='</div><div class="card rp-page">';

  /* ── WRITTEN SCHEME ── */
  const schs=SCH.filter(x=>x.propId===p.id);
  h+='<h2 class="rp-s">10. Written Scheme of Control</h2>';
  if(!schs.length) h+='<p class="rp-p"><b>No written scheme of control is in place.</b> HSG274 Part 2, Para 2.70 '+
    'requires a written scheme for each system that presents a risk of exposure. This is a deficiency requiring '+
    'correction and appears in the action plan below.</p>';
  else h+=schs.map(s=>{
    const a=A.find(x=>x.id===s.assetId);
    return '<p class="rp-p"><b>'+esc(s.title||'Written Scheme')+'</b> ('+esc(s.ref||'')+'), '+
     esc(s.status||'draft')+', prepared '+fmt(s.date)+' by '+esc(s.author||'')+', review due '+fmt(s.reviewDate)+
     (s.reviewDate&&s.reviewDate<today()?' <b>(OVERDUE)</b>':'')+'. Covers '+
     (a?esc((a.ref||'')+' '+(a.location||'')):'the whole site')+'.</p>'+
     '<table class="rp-t"><tbody>'+
     [['Hot water storage',s.hotStore],['Hot water distribution',s.hotDist],
      ['Cold water storage',s.coldStore],['Cold water distribution',s.coldDist],
      ['Monitoring frequency',s.freq],['Responsible person for monitoring',s.rp],
      ['Nominated monitoring points',s.points],['Action level, temperature',s.alTemp],
      ['Action level, sampling',s.alSample],['Servicing schedule',s.servicing]]
     .filter(r=>r[1]).map(r=>'<tr><td style="width:32%">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+
     '</tbody></table>';
  }).join('');

  h+='</div><div class="card rp-page">';

  /* ── ACTION PLAN ── */
  h+='<h2 class="rp-s">11. Remedial Action Plan</h2>'+ planTable(acts);

  /* ── PHOTOS ── */
  const withPh=[].concat(
    assets.filter(a=>(a.photos||[]).length).map(a=>({t:(a.ref||'')+' '+(a.location||''),ph:a.photos})),
    evs.filter(e=>(e.photos||[]).length).map(e=>({t:(EVENT_KINDS[e.kind]||{}).label+' '+fmt(e.date),ph:e.photos}))
  );
  h+='<h2 class="rp-s">12. Photographic Evidence</h2>';
  if(!withPh.length) h+='<p class="rp-p">No photographic evidence recorded.</p>';
  else h+=withPh.map((x,i)=>'<div class="avoid" style="margin-bottom:12px"><b style="font-size:.85rem">Plate '+(i+1)+': '+esc(x.t)+'</b>'+
    '<div class="ph">'+x.ph.map(u=>'<div class="t" style="width:190px;height:auto"><img src="'+u+'" style="height:auto"></div>').join('')+'</div></div>').join('');

  /* ── DOCUMENT REGISTER ── */
  const dcs=DOC.filter(x=>x.propId===p.id);
  h+='<h2 class="rp-s">13. Supporting Documents Held</h2>';
  if(!dcs.length) h+='<p class="rp-p">No supporting documents have been provided or uploaded. '+
    'Where a system schematic, commissioning record or disinfection certificate exists, it should be obtained '+
    'and retained with this assessment.</p>';
  else h+='<table class="rp-t"><thead><tr><th>Document</th><th>Type</th><th>Date</th><th>Notes</th></tr></thead><tbody>'+
    dcs.map(d=>{ const k=DOC_KINDS.find(x=>x[0]===d.kind);
      return '<tr><td>'+esc(d.title||d.filename||'')+'</td><td>'+esc(k?k[1]:d.kind||'')+'</td>'+
      '<td>'+fmt(d.date)+'</td><td>'+esc(d.notes||'')+'</td></tr>'; }).join('')+'</tbody></table>';
  const sch=dcs.filter(d=>d.kind==='schematic'||d.kind==='asbuilt'||d.kind==='floorplan');
  if(sch.length) h+=sch.filter(d=>(d.mime||'').indexOf('image')===0).map((d,i)=>
    '<div class="avoid" style="margin-top:12px"><b style="font-size:.85rem">Drawing '+(i+1)+': '+esc(d.title||'')+'</b>'+
    '<div><img src="'+d.data+'" style="width:100%;max-width:640px;border:1px solid #999;margin-top:6px"></div></div>').join('');

  h+='<h2 class="rp-s">14. Review</h2>'+
   '<p class="rp-p">This assessment must be reviewed at least every two years, and immediately following any change '+
   'to the water system, its use, the building occupancy, a case of Legionnaires\' disease associated with the premises, '+
   'or where monitoring indicates that control measures are no longer effective.</p>';

  h+=rpSig()+'</div>';
  return h;
}

/* ── ACTION PLAN TABLE (shared) ── */
function planTable(acts){
  if(!acts.length) return '<p class="rp-p">No outstanding remedial actions.</p>';
  const order={immediate:0,high:1,medium:2,low:3};
  const rows=acts.slice().sort((a,b)=>(order[a.priority]||9)-(order[b.priority]||9));
  return '<div class="tbl-wrap"><table class="rp-t"><thead><tr><th>#</th><th>Priority</th><th>Action required</th>'+
    '<th>Finding</th><th>Asset / location</th><th>Guidance</th><th>Owner</th><th>Target</th><th>Status</th></tr></thead><tbody>'+
    rows.map((a,i)=>{
      const over=a.due&&a.status!=='closed'&&a.due<today();
      return '<tr><td>'+(i+1)+'</td><td><b>'+(PRI[a.priority]||'')+'</b><br><span style="font-size:.75rem">'+(PRI_T[a.priority]||'')+'</span></td>'+
      '<td>'+esc(a.title)+'</td><td>'+esc(a.detail||'')+'</td><td>'+esc(a.assetRef||'')+'</td>'+
      '<td>'+esc(a.ref||'')+'</td><td>'+esc(a.owner||'Not assigned')+'</td>'+
      '<td>'+fmt(a.due)+(over?'<br><b>OVERDUE</b>':'')+'</td><td>'+esc(a.status||'open')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

  let h='<div class="card rp-page">'+rpHead(p,'Remedial Action Plan',ref);
  h+='<p class="rp-p">This action plan sets out the remedial actions arising from the Legionella Risk Assessment '+
   'for the premises named above. Priorities and target timescales are as follows: Immediate, before further use of '+
   'the affected system; High, within 7 days; Medium, within 1 month; Low, within 3 months.</p>';
  if(imm.length) h+='<div class="note r avoid"><b>'+imm.length+' immediate action'+(imm.length>1?'s':'')+
   ' requiring attention before further use of the affected system.</b></div>';
  h+='<table class="rp-meta"><tbody><tr><td>Total actions</td><td>'+acts.length+
   '</td><td>Outstanding</td><td>'+open.length+'</td></tr>'+
   '<tr><td>Immediate</td><td>'+imm.length+'</td><td>Completed</td><td>'+closed.length+'</td></tr></tbody></table>';
  h+='<h2 class="rp-s">Outstanding Actions</h2>'+planTable(open);

   '<table class="rp-t"><thead><tr><th>Action #</th><th>Completed by</th><th>Date</th><th>Evidence reference</th><th>Signature</th></tr></thead>'+
   '<tbody>'+open.map((a,i)=>'<tr><td>'+(i+1)+'</td><td></td><td></td><td></td><td></td></tr>').join('')+'</tbody></table>';
  h+=rpSig()+'</div>';

/* ── MONITORING SUMMARY ── */
function docMon(p){
  const assets=A.filter(a=>a.propId===p.id);
  const evs=E.filter(e=>e.propId===p.id);
  const ref=(p.ref||'OB-MON')+'-MON-'+today().replace(/-/g,'');
  let h='<div class="card rp-page">'+rpHead(p,'Monitoring and Records Summary',ref);
  h+='<p class="rp-p">This summary reproduces the monitoring, inspection, disinfection and sampling records held '+
   'in SafeSystems.PRO for the premises named above.</p>';

  if(!evs.length) h+='<p class="rp-p"><b>No records held.</b></p>';
  Object.keys(byKind).forEach(k=>{
    h+='<h2 class="rp-s">'+esc((EVENT_KINDS[k]||{}).label||k)+' Records ('+byKind[k].length+')</h2>'+

     '<th>Value</th><th>Result</th><th>Recorded by</th><th>Observation</th></tr></thead><tbody>'+
     byKind[k].map(e=>{ const a=A.find(x=>x.id===e.assetId)||{};
       return '<tr><td>'+fmt(e.date)+'</td><td>'+esc(a.ref||'')+'</td><td>'+esc(a.location||'')+'</td>'+
       '<td>'+esc(e.value||'')+(e.kind==='temperature'&&e.value?'&deg;C':'')+'</td>'+
       '<td>'+(e.pass===false?'<b>FAIL</b>':'Pass')+(e.detail&&e.detail._alLabel?'<br>'+esc(e.detail._alLabel):'')+'</td>'+
       '<td>'+esc(e.by||'')+'</td><td>'+esc(e.note||'')+
       (e.detail?detailRender(e.detail):'')+'</td></tr>';
     }).join('')+'</tbody></table></div>';
  });
  h+='<h2 class="rp-s">Assets With No Records</h2>';
  const none=assets.filter(a=>!evs.some(e=>e.assetId===a.id));

  else h+='<table class="rp-t"><thead><tr><th>Ref</th><th>Type</th><th>Location</th></tr></thead><tbody>'+
    none.map(a=>'<tr><td>'+esc(a.ref||'')+'</td><td>'+esc((TYPES[a.type]||{}).label||'')+'</td><td>'+esc(a.location||'')+'</td></tr>').join('')+
    '</tbody></table>';
  h+=rpSig()+'</div>';
  return h;
}

    'Reads only, the v1 data is left untouched. Safe to run once.</div>'+
    '<div class="btns"><button class="btn" onclick="migrate()">Import v1 data</button></div></div>'+
    '<div class="card"><h3>Module</h3><div style="font-size:.87rem;color:var(--txt-2);line-height:1.9">'+
    'SafeWater.PRO Legionella v2<br>Part of SafeSystems.PRO<br>'+
    'L8 (ACoP), HSG274 Parts 1&ndash;3, COSHH 2002<br>Omnibosh Safety Solutions Ltd<br>'+
    'No browser-local storage. All state in Firestore.</div></div>');
}
async function migrate(){
  if(!confirm('Import properties and systems from the v1 module?')) return;
  const map={cwst:'cwst',cold_direct:'cold_direct',calorifier:'calorifier',combi:'combi',
    thermal_store:'calorifier',electric_immersion:'calorifier',point_of_use:'point_of_use',
    shower_fixed:'shower_fixed',shower_flex:'shower_flex',tmv:'tmv',dead_leg:'dead_leg',
    hose_reel:'hose_reel',spray_tap:'spray_tap',infrequent_outlet:'infrequent',
    cooling_tower:'cooling_tower',evap_condenser:'evap_condenser',spa_pool:'spa',
    decorative_fountain:'fountain',other:'other'};
  try{
    const ps=await db.collection('legionella_properties').get();
    let np=0,na=0; const idmap={};
    for(const d of ps.docs){
      const v=d.data();
      const ref=await db.collection(C.props).add({
        uid:me.uid, name:v.propName||'Unnamed', address:v.propAddress||'', ref:v.propRef||'',
        type:v.propType||'other', year:v.propYear||'', dutyHolder:v.propDutyHolder||'',
        dutyHolderOrg:v.propDutyHolderOrg||'', rp:v.propRP||'', rpContact:v.propRPContact||'',
        notes:v.propNotes||'', photos:v.photos||[],
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      idmap[d.id]=ref.id; np++;
    }
    const ss=await db.collection('legionella_systems').get();
    for(const d of ss.docs){
      const v=d.data(); const pid=idmap[v.sysProperty];
      if(!pid) continue;
      await db.collection(C.assets).add({
        uid:me.uid, propId:pid, type:map[v.sysType]||'other', ref:v.sysRef||'',
        location:v.sysLocation||'', capacity:v.sysCapacity||'', serving:v.sysServing||'',
        risk:v.sysRisk||'medium', notes:v.sysNotes||'', photos:v.photos||[], status:'',
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      na++;
    }
    await fetchAll(); toast('Imported '+np+' properties and '+na+' assets.'); go('sites');
  }catch(e){ toast('Import failed: '+e.message); }
}

let PB={};                                   /* photo buffers keyed by field id */
function pbGet(k){ return PB[k]||[]; }
function pbClear(k){ if(k) delete PB[k]; else PB={}; }
function pickPhotos(inp,key){
  key=key||inp.id;
  PB[key]=PB[key]||[];
  [...inp.files].forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas');
        const w=Math.min(1100,img.width), h=Math.round(img.height*(w/img.width));
        cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        PB[key].push(cv.toDataURL('image/jpeg',0.72));
        drawThumbs(key);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  });
  inp.value='';
}
function drawThumbs(key){
  const el=$(key+'T'); if(!el) return;
  el.innerHTML=pbGet(key).map((p,i)=>
    '<div class="t"><img src="'+p+'"><b onclick="rmPhoto(\''+key+'\','+i+')">&times;</b></div>').join('');
}
function rmPhoto(key,i){ PB[key].splice(i,1); drawThumbs(key); }
function photoField(label,key,existing){
  return '<div class="fg"><label>'+label+'</label>'+
    '<div class="up"><label class="btn o sm"><input type="file" id="'+key+'" accept="image/*" multiple onchange="pickPhotos(this)"> + Add photo / camera</label></div>'+
    '<div class="ph" id="'+key+'T"></div>'+
    ((existing&&existing.length)?'<div class="ph" style="margin-top:6px;opacity:.75">'+existing.map(p=>'<div class="t"><img src="'+p+'"></div>').join('')+'</div>':'')+
    '</div>';
}
function fileField(label,key){
  return '<div class="fg"><label>'+label+'</label>'+
    '<div class="up"><label class="btn o sm"><input type="file" id="'+key+'" accept="image/*,.pdf" onchange="pickFile(this)"> + Upload file</label></div>'+
    '<div id="'+key+'N" style="font-size:.8rem;color:var(--txt-3);margin-top:6px"></div></div>';
}
let FB={};
function pickFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    FB[inp.id]={name:f.name,type:f.type,data:ev.target.result};
    $(inp.id+'N').textContent=f.name+' ready';
  };
  r.readAsDataURL(f);
}

/* HSG274 Part 2 sampling action levels */
function actionLevel(cfu){
  const n=parseFloat(cfu);
  if(isNaN(n)) return null;
  if(n<100)   return {band:'satisfactory',label:'Satisfactory',cls:'p-ok',
    txt:'System considered to be under control. Continue with the existing monitoring regime.'};
  if(n<=1000) return {band:'review',label:'Investigate',cls:'p-warn',
    txt:'Re-sample and carry out a review of the control measures. If the count is confirmed, review the '+
        'control measures and the risk assessment to identify any remedial action.'};
  return {band:'immediate',label:'Immediate action',cls:'p-bad',
    txt:'Re-sample and carry out an immediate review of the control measures and the risk assessment to '+
        'identify remedial actions, including possible disinfection of the system.'};
}

function detailKeyFor(assetType,kind){
  if(kind==='sample') return 'sample';
  if(kind==='disinfection') return 'disinfection';
  if(kind==='inspection'){
    if(assetType==='cwst') return 'cwst';
    if(assetType==='tmv') return 'tmv';
    if(assetType==='calorifier') return 'calorifier';
  }
  return null;
}

  const d=existing||{};
  let h='<hr><div style="font-size:.86rem;color:var(--blue-l);font-weight:700">'+esc(s.title)+
        '</div><div class="ref" style="margin-bottom:10px">'+esc(s.ref)+'</div>';
  h+=s.sels.map(x=>'<div class="fg"><label>'+esc(x[1])+'</label><select id="d_'+x[0]+'">'+
      x[2].map(o=>'<option'+(d[x[0]]===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>').join('');
  if(s.nums.length) h+='<div class="grid g2">'+s.nums.map(x=>
      '<div class="fg"><label>'+esc(x[1])+'</label><input type="number" step="0.01" id="d_'+x[0]+'" value="'+
      esc(d[x[0]]==null?'':d[x[0]])+'"'+(key==='sample'&&x[0]==='legTotal'?' oninput="alPreview()"':'')+'></div>').join('')+'</div>';
  if(key==='sample') h+='<div id="alBox" style="margin-bottom:12px"></div>';
  if(s.checks.length) h+='<div style="font-size:.78rem;color:var(--txt-3);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.6px">Checks</div>'+

      '><div class="lb">'+esc(x[1])+'</div></div>').join('');

      '><div class="lb">'+esc(x[1])+'</div></div>').join('');

function alPreview(){
  const box=$('alBox'); if(!box) return;
  const al=actionLevel(($('d_legTotal')||{}).value);
  if(!al){ box.innerHTML=''; return; }
  box.innerHTML='<div class="note '+(al.band==='immediate'?'r':al.band==='review'?'w':'g')+'">'+
    '<span class="pill '+al.cls+'">'+al.label+'</span> '+esc(al.txt)+'</div>';
  const p=$('ePass'); if(p) p.checked=(al.band==='satisfactory');
}

function collectDetail(key){
  if(!key) return null;
  const s=DETAIL_SCHEMA[key]; if(!s) return null;
  const out={_key:key,_title:s.title,_ref:s.ref};
  s.nums.forEach(x=>{ const e=$('d_'+x[0]); if(e&&e.value!=='') out[x[0]]=e.value; });
  s.checks.concat(s.negs).forEach(x=>{ const e=$('d_'+x[0]); if(e) out[x[0]]=e.checked; });
  s.sels.forEach(x=>{ const e=$('d_'+x[0]); if(e) out[x[0]]=e.value; });
  s.txts.forEach(x=>{ const e=$('d_'+x[0]); if(e&&e.value.trim()) out[x[0]]=e.value.trim(); });
  if(key==='sample'){ const al=actionLevel(out.legTotal); if(al){ out._band=al.band; out._alLabel=al.label; } }
  return out;
}

function detailRender(d){
  if(!d||!d._key) return '';
  const s=DETAIL_SCHEMA[d._key]; if(!s) return '';
  const rows=[];
  s.sels.forEach(x=>{ if(d[x[0]]) rows.push([x[1],d[x[0]]]); });
  s.nums.forEach(x=>{ if(d[x[0]]!=null&&d[x[0]]!=='') rows.push([x[1],d[x[0]]]); });
  s.checks.forEach(x=>{ if(x[0] in d) rows.push([x[1],d[x[0]]?'Yes':'No']); });
  s.negs.forEach(x=>{ if(d[x[0]]) rows.push([x[1],'PRESENT']); });
  s.txts.forEach(x=>{ if(d[x[0]]) rows.push([x[1],d[x[0]]]); });
  if(d._alLabel) rows.unshift(['Action level assessment',d._alLabel]);
  if(!rows.length) return '';
  return '<table class="rp-t" style="margin-top:8px"><tbody>'+rows.map(r=>
    '<tr><td style="width:46%">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table>';
}

    '<input type="hidden" id="acAssetId" value="'+(a.assetId||assetId||'')+'">'+
    '<div class="btns"><button class="btn" onclick="saveAct(\''+(id||'')+'\')">Save</button>'+
    (id?'<button class="btn r" onclick="delAct(\''+id+'\')">Delete</button>':'')+
    '<button class="btn o" onclick="closeMo()">Cancel</button></div>');
}
async function saveAct(id){
  const d={propId:$('acProp').value,priority:$('acPri').value,title:$('acTitle').value.trim(),
    detail:$('acDetail').value.trim(),assetRef:$('acAsset').value.trim(),ref:$('acRef').value.trim(),
    owner:$('acOwner').value.trim(),due:$('acDue').value,status:$('acStatus').value,assetId:$('acAssetId').value};
  const nc=pbGet('acPh'); if(nc.length){ const ex=(ACT.find(x=>x.id===id)||{}).photos||[]; d.photos=ex.concat(nc); }
  if(!d.title){ toast('Action text required.'); return; }
  try{ await save(C.actions,id,d); pbClear('acPh'); await fetchAll(); closeMo(); toast('Action saved.'); go('actions'); }
  catch(e){ toast('Failed: '+e.message); }
}
async function delAct(id){ if(!confirm('Delete this action?'))return; await del(C.actions,id); await fetchAll(); closeMo(); go('actions'); }

/* ── ASSESSMENTS ── */
function editAssess(id){
  const a=id?ASS.find(x=>x.id===id):{propId:view.propId||(P[0]||{}).id,date:today(),reviewDate:addDays(today(),365)};
  const pid=a.propId;
  const s=pid?scorecard(pid):null; const g=pid?gaps(pid):[];
  const pop=a.pop||[]; const rf=a.rf||[];
  openMo(id?'Assessment':'New Assessment',
    '<div class="fg"><label>Property <span class="req">*</span></label><select id="asProp" onchange="view.propId=this.value;editAssess()">'+
      P.map(p=>'<option value="'+p.id+'"'+(pid===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
    (s?'<div class="note"><b>Generated from the register.</b> '+s.assets.length+' assets, '+s.pct+
       '% of monitoring in date, '+g.length+' gaps, '+s.openA.length+' open actions. Compliance score '+s.score+'%.</div>':'')+
    (g.length?'<div class="card" style="max-height:150px;overflow:auto"><b style="font-size:.85rem">Gaps carried into this assessment</b>'+
       g.map(x=>'<div class="m" style="margin-top:5px">&bull; '+esc(x.t)+'</div>').join('')+'</div>':'')+
    '<div class="grid g2">'+fld('Assessment date','asDate',a.date,'date',true)+fld('Review date','asReview',a.reviewDate,'date')+'</div>'+
    '<div class="grid g2">'+fld('Assessor','asBy',a.assessor||me.name,'text',true)+
      fld('Assessor qualifications','asQual',a.qual)+'</div>'+
    '<hr><label style="font-size:.85rem;color:var(--blue-l);font-weight:700">Population at risk</label>'+
    POP.map((x,i)=>'<div class="ck"><input type="checkbox" id="pop'+i+'"'+(pop.indexOf(x)>=0?' checked':'')+
      '><div class="lb">'+esc(x)+'</div></div>').join('')+
    '<hr><label style="font-size:.85rem;color:var(--blue-l);font-weight:700">Risk factors present</label>'+
    RISKF.map((x,i)=>'<div class="ck"><input type="checkbox" id="rf'+i+'"'+(rf.indexOf(x[0])>=0?' checked':'')+
      '><div class="lb"><b>'+esc(x[0])+'</b><span class="ref">'+esc(x[1])+'</span></div></div>').join('')+
    '<hr><div class="grid g2">'+
      '<div class="fg"><label>Likelihood</label><select id="asLik">'+
        ['Improbable','Unlikely','Possible','Likely','Almost certain'].map(r=>'<option'+(a.lik===r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'+
      '<div class="fg"><label>Consequence</label><select id="asCon">'+
        ['Negligible','Minor','Moderate','Major','Catastrophic'].map(r=>'<option'+(a.con===r?' selected':'')+'>'+r+'</option>').join('')+'</select></div></div>'+
    '<div class="fg"><label>Overall rating</label><select id="asRate">'+
      ['Low','Medium','High','Very High'].map(r=>'<option'+(a.rating===r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'+
    txt('Assessor narrative and judgement','asNote',a.note)+
    txt('Scope, limitations and anything not accessed','asLimit',a.limits)+
    '<div class="btns"><button class="btn" onclick="saveAssess(\''+(id||'')+'\')">Save</button>'+
    (id?'<button class="btn r" onclick="delAssess(\''+id+'\')">Delete</button>':'')+
    '<button class="btn o" onclick="closeMo()">Cancel</button></div>');
}
function editAssessRefresh(pid){ view.propId=pid; const cur=$('asDate')?null:null; editAssess(); }
async function saveAssess(id){
  const pop=POP.filter((x,i)=>$('pop'+i)&&$('pop'+i).checked);
  const rf=RISKF.filter((x,i)=>$('rf'+i)&&$('rf'+i).checked).map(x=>x[0]);
  const d={propId:$('asProp').value,date:$('asDate').value,reviewDate:$('asReview').value,
    assessor:$('asBy').value.trim(),qual:($('asQual')||{}).value||'',
    rating:$('asRate').value,lik:($('asLik')||{}).value||'',con:($('asCon')||{}).value||'',
    note:$('asNote').value.trim(),limits:$('asLimit').value.trim(),pop:pop,rf:rf};
  if(!d.propId||!d.date){ toast('Property and date required.'); return; }
  try{ await save(C.assess,id,d); await fetchAll(); closeMo(); toast('Assessment saved.'); go('assess'); }
  catch(e){ toast('Failed: '+e.message); }
}
async function delAssess(id){ if(!confirm('Delete this assessment?'))return; await del(C.assess,id); await fetchAll(); closeMo(); go('assess'); }

/* ── PHOTO VIEWER ── */
function viewPhoto(id,src,i){
  let arr=[];
  if(src==='prop')  arr=((P.find(x=>x.id===id)||{}).photos)||[];
  if(src==='asset') arr=((A.find(x=>x.id===id)||{}).photos)||[];
  if(src==='act')   arr=((ACT.find(x=>x.id===id)||{}).photos)||[];
  if(!arr.length) return;
  openMo('Photograph '+(i+1)+' of '+arr.length,
    '<img src="'+arr[i]+'" style="width:100%;border-radius:8px">'+
    '<div class="btns" style="margin-top:12px">'+
      (i>0?'<button class="btn o" onclick="viewPhoto(\''+id+'\',\''+src+'\','+(i-1)+')">Previous</button>':'')+
      (i<arr.length-1?'<button class="btn o" onclick="viewPhoto(\''+id+'\',\''+src+'\','+(i+1)+')">Next</button>':'')+
      '<button class="btn r" onclick="rmStoredPhoto(\''+id+'\',\''+src+'\','+i+')">Delete photo</button>'+
      '<button class="btn o" onclick="closeMo()">Close</button></div>');
}
async function rmStoredPhoto(id,src,i){
  if(!confirm('Delete this photograph?')) return;
  const col = src==='prop'?C.props : src==='asset'?C.assets : C.actions;
  const arrObj = src==='prop'?P.find(x=>x.id===id) : src==='asset'?A.find(x=>x.id===id) : ACT.find(x=>x.id===id);
  if(!arrObj) return;
  const ph=(arrObj.photos||[]).slice(); ph.splice(i,1);
  try{ await save(col,id,{photos:ph}); await fetchAll(); closeMo(); toast('Photograph deleted.');
       go(src==='prop'?'property':src==='asset'?'asset':'actions', id); }
  catch(e){ toast('Failed: '+e.message); }
}

/* ── FIELD BUILDERS ── */
function fld(label,id,val,type,req){
  return '<div class="fg"><label>'+label+(req?' <span class="req">*</span>':'')+'</label>'+
    '<input type="'+(type||'text')+'" id="'+id+'" value="'+esc(val||'')+'"></div>';
}
function txt(label,id,val){
  return '<div class="fg"><label>'+label+'</label><textarea id="'+id+'" rows="3">'+esc(val||'')+'</textarea></div>';
}
</script>
</body>
